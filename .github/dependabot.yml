version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # One PR a month for routine version bumps. Three runtime dependencies
      # and a test runner do not need a pull request each.
      python:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
