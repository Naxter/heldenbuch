        <button class="btn ghost" onclick="editHero()">Name &amp; Beschreibung</button>
        <button class="btn ghost" onclick="moreVariants()">Noch welche zeichnen
          · ${eur(2 * sheetUsd())}</button>
        ${pickerHtml()}
        <button class="btn" onclick="go('look')">Weiter zum Look</button>
      </div></div>
    <div class="grid g3" style="margin-top:1.2rem">` + hero.variant_urls.map((v) => `
      <div class="pick ${v.path === hero.sheet ? "on" : ""}" role="button" tabindex="0"
        aria-label="Diese Variante wählen" onclick="pickSheet('${v.path}')">
        <button class="xzoom" title="Groß ansehen"
          onclick="event.stopPropagation();zoom('${esc(v.url)}')">🔍</button>
        <img src="${esc(v.url)}" alt="Charakterblatt-Variante">
        <div class="cap"><small>${v.path === hero.sheet ? "ausgewählt" : "auswählen"}</small></div>
      </div>`).join("") + `</div>
    <details style="margin-top:1rem"><summary class="small muted">So habe ich ihn beschrieben</summary>
      <p class="small muted" style="margin-top:.5rem">${esc(hero.description)}</p></details>
  </div>`;
}

async function editHero() {
  const hero = await api(`/api/book/heroes/${S.heroId}`);
  openModal(`<h3>Figur bearbeiten</h3>
    <label class="f"><span>Name</span>
      <input type="text" id="m-name" value="${esc(hero.name)}"></label>
    <label class="f"><span>Beschreibung — sie ist der Maßstab, an dem jede Seite
      auf Ähnlichkeit geprüft wird</span>
      <textarea id="m-desc" rows="7">${esc(hero.description)}</textarea></label>
    <p class="small muted">Wirkt auf alles, was ab jetzt gezeichnet wird; schon
      vorhandene Blätter bleiben unverändert.</p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn" id="m-save">Speichern</button></div>`);
  $("m-save").onclick = async () => {
    await api(`/api/book/heroes/${S.heroId}`, { method: "PUT", body: JSON.stringify(
      { name: $("m-name").value.trim(), description: $("m-desc").value.trim() }) });
    closeModal(); toast("Gespeichert."); renderHero();
  };
}

function deleteHero(id) {
  confirmModal("Diese Figur löschen?",
    "Charakterblätter und Fotos werden vom Rechner gelöscht. Fertige Bücher behalten ihre Bilder, verlieren aber die Verbindung zur Figur.",
    "Löschen", async () => {
      await api(`/api/book/heroes/${id}`, { method: "DELETE" });
      if (S.heroId === id) { S.heroId = null; store.set("heroId", null);
        S.styleId = null; store.set("styleId", null); }
      toast("Figur gelöscht."); renderHero();
    });
}

function wirePhotoDrop() {
  const drop = $("h-drop"), input = $("h-file");
  drop.onclick = () => input.click();
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over");
    takePhotos([...e.dataTransfer.files]); };
  input.onchange = () => takePhotos([...input.files]);
  // Deliberately NOT clearing pendingPhotos here: this runs on every re-render
  // of the screen, and switching the image service must not discard uploads.
  renderThumbs();
}

async function takePhotos(files) {
  // Append, so choosing photos twice does not silently discard the first batch.
  const images = files.filter((f) => f.type.startsWith("image/"));
  const fresh = await Promise.all(images.map(readFile));
  pendingPhotos = pendingPhotos.concat(fresh).slice(0, 4);
  renderThumbs();
}

function renderThumbs() {
  $("h-thumbs").innerHTML = pendingPhotos.map((p, i) => `
    <img src="${p.data}" alt="" title="Klicken zum Entfernen"
      style="cursor:pointer" onclick="dropPhoto(${i})">`).join("");
}

function dropPhoto(index) { pendingPhotos.splice(index, 1); renderThumbs(); }

function createHero() {
  const description = $("h-desc").value.trim();
  if (!pendingPhotos.length && !description) {
    toast("Entweder Fotos hochladen oder die Figur kurz beschreiben."); return;
  }
  runJob("hero_create",
    { name: $("h-name").value.trim(), description, age_hint: $("h-age").value.trim(),
      photos: pendingPhotos, variants: 3, ...drawParams() },
    "Figur wird gezeichnet",
    (job) => {
      if (job.result.hero_id) {
        S.heroId = job.result.hero_id; store.set("heroId", S.heroId);
        S.styleId = null; store.set("styleId", null);
        pendingPhotos = [];  // saved with the hero now; the staging is done
      }
      renderHero();
    });
}

function moreVariants() {
  runJob("hero_more", { hero_id: S.heroId, variants: 2, ...drawParams() },
    "Weitere Varianten", renderHero);
}
function chooseHero(id) {
  if (id !== S.heroId) {  // re-clicking the chosen hero must not reset the style
    S.heroId = id; store.set("heroId", id);
    S.styleId = null; store.set("styleId", null);
  }
  renderHero();
}
async function pickSheet(path) {
  await api(`/api/book/heroes/${S.heroId}`,
    { method: "PUT", body: JSON.stringify({ sheet: path }) });
  renderHero();
}

/* =========================================================== 2. look */

// A style try renders two previews plus the styled character sheet.
function styleTryUsd() { return 2 * previewUsd() + sheetUsd(); }

async function renderLook() {
  const [hero, { styles }] = await Promise.all([
    api(`/api/book/heroes/${S.heroId}`), api("/api/book/styles"),
  ]);
  const ready = (s) => !!(s.sheets || {})[S.heroId];
  const chosen = styles.find((s) => s.id === S.styleId && ready(s));
  const keptWish = $("style-wish")?.value ?? "";  // survive picker re-renders

  view().innerHTML = stepsBar("look") + `
    <div class="card">
      <div class="spread"><div>
        <h2>Wie soll das Buch aussehen?</h2>
        <p class="lede">Ich zeichne ${esc(hero.name || "die Figur")} sofort im gewählten Stil,
          damit du die echte Kombination siehst und nicht nur eine Beschreibung.</p></div>
        ${chosen ? `<button class="btn" onclick="go('story')">Weiter zur Geschichte</button>` : ""}
      </div>

      <div class="chips" id="preset-list" style="margin-bottom:.5rem"></div>
      <div class="row" style="margin:0 0 1.1rem">
        <p class="small muted" style="margin:0;flex:1;min-width:240px">Ein Klick probiert den
          Stil sofort aus — zwei Vorschauen und ein Charakterblatt, zusammen
          ${eur(styleTryUsd())}.</p>
        ${pickerHtml()}
      </div>

      <div class="row" style="margin-bottom:.8rem">
        <input type="text" id="style-wish" placeholder="Oder beschreib es selbst: „wie ein alter Scherenschnitt“"
          style="flex:1;min-width:260px" value="${esc(keptWish)}">
        <button class="btn ghost" id="style-wish-go">Ausprobieren · ${eur(styleTryUsd())}</button>
      </div>

      <div class="drop" id="style-drop" style="padding:1rem" role="button" tabindex="0"
        aria-label="Stil-Vorlage auswählen oder hierher ziehen">
        <div class="small"><b>Oder ein Bild als Vorlage</b> — eine Zeichnung deines Sohnes,
          ein Foto von etwas Gebasteltem. Worte kommen an manche Looks nicht heran.
          (${eur(styleTryUsd())})
          <input type="file" id="style-file" accept="image/*" class="hide"></div>
        <p class="small muted" style="margin:.5rem 0 0">Das Bild wird hier im Stil-Ordner
          gespeichert und einmal an den Text-Dienst geschickt, um den Look zu beschreiben —
          danach begleitet es jede Zeichnung mit diesem Stil als Referenz.
          Stil löschen entfernt es wieder.</p>
      </div>
    </div>

    ${styles.length ? `<div class="card">
      <div class="spread"><div>
        <h2>Ausprobiert</h2>
        <p class="lede" style="margin-bottom:0">Ein Klick wählt den Stil für das nächste Buch;
          „ansehen“ zeigt alle Vorschauen.</p>
      </div>${chosen && S.status.can_scout ? `
        <button class="btn ghost" onclick="runScout()">Welcher Bilddienst kann das am besten?</button>` : ""}
      </div>
      <div class="grid g2" style="margin-top:1.1rem">` + styles.map((s) => {
        const isReady = ready(s);
        const thumb = s.preview_urls[0] || (s.sheets || {})[S.heroId] && s.sheet_urls[S.heroId];
        return `
        <div class="pick ${s.id === S.styleId && isReady ? "on" : ""}"
          role="button" tabindex="0" aria-label="Stil ${esc(s.name)}"
          onclick="${isReady ? `pickStyle('${s.id}')` : `styleDetail('${s.id}')`}">
          <button class="xdel" title="Stil löschen"
            onclick="event.stopPropagation();deleteStyle('${s.id}')">×</button>
          ${thumb ? `<button class="xzoom" title="Groß ansehen"
            onclick="event.stopPropagation();zoom('${esc(thumb)}')">🔍</button>` : ""}
          ${thumb ? `<img src="${esc(thumb)}" alt="" style="aspect-ratio:4/3;object-fit:cover">` : ""}
          <div class="cap"><b>${esc(s.name)}</b>
            <small>${isReady
              ? (s.id === S.styleId ? "ausgewählt" : "auswählen")
              : "für eine andere Figur angelegt"}${
              s.recommended_backend ? ` · empfohlen: ${esc(s.recommended_backend)}` : ""}</small>
            <div class="acts" style="margin-top:.4rem">
              <button class="btn ghost tiny"
                onclick="event.stopPropagation();styleDetail('${s.id}')">ansehen</button>
              ${isReady ? "" : `<button class="btn ghost tiny"
                onclick="event.stopPropagation();adoptStyle('${s.id}')">
                Für ${esc(hero.name || "diese Figur")} einrichten · ${eur(sheetUsd())}</button>`}
            </div></div>
        </div>`;
      }).join("") + `</div></div>` : ""}`;

  $("preset-list").innerHTML = (S.status.style_presets || []).map((p) => `
    <label class="chip" onclick="tryPreset('${p.key}')" title="${esc(p.hint)} — ${eur(styleTryUsd())}">${esc(p.name)}</label>
  `).join("");

  $("style-wish-go").onclick = () => {
    const wish = $("style-wish").value.trim();
    if (!wish) return;
    runJob("style_try", { hero_id: S.heroId, wish, previews: 2, ...drawParams() },
      "Stil wird ausprobiert", afterStyle);
  };

  const drop = $("style-drop"), file = $("style-file");
  drop.onclick = () => file.click();
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = async (e) => { e.preventDefault(); drop.classList.remove("over");
    await styleFromImage([...e.dataTransfer.files][0]); };
  file.onchange = () => styleFromImage(file.files[0]);
}

async function styleFromImage(file) {
  if (!file || !file.type.startsWith("image/")) return;
  const reference = await readFile(file);
  runJob("style_try", { hero_id: S.heroId, reference, previews: 2, ...drawParams() },
    "Stil wird aus dem Bild abgeleitet", afterStyle);
}

function tryPreset(key) {
  runJob("style_try", { hero_id: S.heroId, preset: key, previews: 2, ...drawParams() },
    "Stil wird ausprobiert", afterStyle);
}
function afterStyle(job) {
  if (job.result.style_id) { S.styleId = job.result.style_id; store.set("styleId", S.styleId); }
  renderLook();
}
function pickStyle(id) { S.styleId = id; store.set("styleId", id); renderLook(); }

async function styleDetail(id) {
  const { styles } = await api("/api/book/styles");
  const s = styles.find((x) => x.id === id);
  if (!s) return;
  const sheet = (s.sheet_urls || {})[S.heroId];
  const blocks = [
    ...s.preview_urls.map((u, i) => [u, `Vorschau ${i + 1}`]),
    ...(sheet ? [[sheet, "Charakterblatt in diesem Stil"]] : []),
    ...(s.reference_url ? [[s.reference_url, "Vorlage"]] : []),
  ];
  openModal(`<h3>${esc(s.name)}</h3>
    <p class="small muted" style="margin-bottom:1rem">${esc(s.description)}</p>
    ${blocks.length ? `<div class="grid g3" style="margin-bottom:1rem">` + blocks.map(([u, label]) => `
      <div><img src="${esc(u)}" alt="" onclick="zoom('${esc(u)}')">
        <span class="vlabel">${esc(label)}</span></div>`).join("") + `</div>` : ""}
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" style="color:var(--bad)"
        onclick="closeModal();deleteStyle('${s.id}')">Löschen</button>
      <button class="btn ghost" onclick="closeModal()">Schließen</button>
      ${sheet ? `<button class="btn" onclick="closeModal();pickStyle('${s.id}')">Diesen Stil wählen</button>`
              : `<button class="btn" onclick="closeModal();adoptStyle('${s.id}')">
                  Für diese Figur einrichten · ${eur(sheetUsd())}</button>`}
    </div>`);
}

function adoptStyle(id) {
  runJob("style_adopt", { hero_id: S.heroId, style_id: id, ...drawParams() },
    "Stil wird eingerichtet", afterStyle);
}

function deleteStyle(id) {
  confirmModal("Diesen Stil löschen?",
    "Vorschauen und Charakterblätter dieses Stils werden gelöscht. Bücher, die damit gezeichnet wurden, behalten ihre Bilder.",
    "Löschen", async () => {
      await api(`/api/book/styles/${id}`, { method: "DELETE" });
      if (S.styleId === id) { S.styleId = null; store.set("styleId", null); }
      toast("Stil gelöscht."); renderLook();
    });
}

function runScout() {
  const backends = (S.status.image_backends || []).filter((b) => b.ready).length;
  const usd = 2 * backends * (est().preview_usd || 0.06);
  confirmModal("Bilddienste vergleichen?",
    `Zwei Testszenen mit jedem der ${backends} verfügbaren Bilddienste — ${2 * backends} Bilder, ${eur(usd)}.`,
    "Vergleichen", () =>
      runJob("style_scout", { hero_id: S.heroId, style_id: S.styleId },
        "Bilddienste werden verglichen", renderLook));
}

/* =========================================================== 3. story */

async function renderStory() {
  const book = S.bookId ? await api(`/api/book/books/${S.bookId}`).catch(() => null) : null;

  const languageChips = (selected) => (S.status.languages || []).map((l) => `
    <label class="chip ${selected.includes(l.code) ? "on" : ""}">
      <input type="checkbox" value="${l.code}" ${selected.includes(l.code) ? "checked" : ""}
        onchange="this.parentNode.classList.toggle('on',this.checked)">${esc(l.name)}</label>`).join("");

  view().innerHTML = stepsBar("story") + `
    <div class="card">
      <h2>Worum soll es gehen?</h2>
      <p class="lede">Ein Satz reicht. Wenn dir nichts einfällt, lass das Feld leer —
        dann denke ich mir etwas aus, das zu dem Alter passt.</p>

      <label class="f"><span>Die Idee</span>
        <textarea id="s-idea" rows="3"
          placeholder="Eine Geschichte über Angst im Dunkeln, mit einem Leuchtturm.">${esc(book?.idea || "")}</textarea></label>

      <div class="grid g2">
        <label class="f"><span>Für welches Alter?</span>
          <select id="s-age">${(S.status.ages || []).map((a) => `
            <option value="${a.key}" ${(book?.age || "4-5") === a.key ? "selected" : ""}>
              ${esc(a.label)} — ${a.pages} Seiten</option>`).join("")}</select></label>
        <label class="f"><span>Bildqualität</span>
          <select id="s-quality">${(S.status.render_profiles || []).map((p) => `
            <option value="${p.key}" ${(book?.render_quality || "draft") === p.key ? "selected" : ""}>
              ${esc(p.label)}</option>`).join("")}</select></label>
      </div>

      <label class="f"><span>Sprachen — die Bilder sind für alle dieselben, nur die Worte ändern sich</span></label>
      <div class="chips" id="s-langs">${languageChips(book?.languages || ["de"])}</div>

      <div class="row" style="margin-top:1rem">
        <label class="check"><input type="checkbox" id="s-rhyme" ${book?.rhyme ? "checked" : ""}>
          In Reimen</label>
        <label class="check"><input type="checkbox" id="s-revise" checked>
          Danach noch einmal überarbeiten <span class="muted small">(empfohlen)</span></label>
      </div>

      <div class="row" style="margin-top:1.3rem">
        <button class="btn" id="s-go" ${can("writing") ? "" : `disabled title="Es fehlt ein Text-Schlüssel — siehe Startseite"`}>${book ? "Neue Geschichte schreiben" : "Geschichte schreiben"}</button>
        ${book ? `<button class="btn ghost" onclick="go('book')">Zu den Bildern</button>` : ""}
      </div>
    </div>
    ${book ? storyEditor(book) : ""}`;

  $("s-go").onclick = () => {
    const languages = [...$("s-langs").querySelectorAll("input:checked")].map((i) => i.value);
    if (!languages.length) return toast("Mindestens eine Sprache auswählen.");
    runJob("story_write", {
      hero_id: S.heroId, style_id: S.styleId, idea: $("s-idea").value.trim(),
      age: $("s-age").value, languages, render_quality: $("s-quality").value,
      rhyme: $("s-rhyme").checked, revise: $("s-revise").checked,
    }, "Geschichte wird geschrieben", (job) => {
      if (job.result.book_id) { S.bookId = job.result.book_id; store.set("bookId", S.bookId); }
      renderStory();
    });
  };
}

function storyEditor(book) {
  const language = (S.editLang && book.languages.includes(S.editLang))
    ? S.editLang : (book.primary_language || book.languages[0]);
  const layoutOptions = (current) => (S.status.layouts || []).map((l) =>
    `<option value="${l.key}" ${l.key === current ? "selected" : ""}>${esc(l.key)}</option>`).join("");

  const languageTabs = book.languages.length > 1 ? `
    <div class="chips" style="margin-top:1rem">${book.languages.map((code) => {
      const name = (S.status.languages.find((l) => l.code === code) || {}).name || code;
      return `<label class="chip ${code === language ? "on" : ""}"
        onclick="setEditLang('${code}')">${esc(name)}</label>`;
    }).join("")}</div>` : "";

  // The rail: one dot per page, coloured by what needs attention, jumping
  // straight to the page. Sixteen pages of forms need a map.
  const rail = book.pages.length > 6 ? `
    <div class="row" style="gap:.25rem;margin-top:1rem" aria-label="Seiten-Navigation">
      ${book.pages.map((p) => {
        const colour = p.error ? "var(--bad)"
          : (p.check_status === "failed" || p.image_stale) ? "var(--warn)"
          : p.image_url ? "var(--good)" : "var(--line)";
        return `<a href="#edit-page-${p.index}" title="Seite ${p.index}"
          style="width:1.5rem;height:1.5rem;border-radius:6px;display:grid;place-items:center;
          font-size:.7rem;text-decoration:none;color:var(--fg);
          border:2px solid ${colour}">${p.index}</a>`;
      }).join("")}</div>` : "";

  return `<div class="card">
    <div class="spread"><div>
      <h2>${esc(book.title[language] || book.display_title)}</h2>
      <p class="lede" style="margin-bottom:0">${book.pages.length} Seiten. Text und
        Bildanweisung sind direkt editierbar und werden beim Verlassen des Feldes
        gespeichert — „KI: neu“ lässt die Seite stattdessen neu schreiben.</p></div>
      <button class="btn" onclick="go('book')">Bilder zeichnen</button></div>

    ${book.cast.length ? `<p class="small muted" style="margin-top:.8rem">
      Weitere Figuren und Orte, die auch ein Referenzblatt bekommen:
      ${book.cast.map((c) => esc(c.name)).join(", ")}</p>` : ""}
    ${languageTabs}
    ${rail}

    <div style="margin-top:1.2rem">` + book.pages.map((p) => `
      <div id="edit-page-${p.index}"
        style="display:flex;gap:.9rem;padding:.7rem 0;border-bottom:1px solid var(--line)">
        ${p.image_url
          ? `<img src="${esc(p.image_url)}" alt="Bild Seite ${p.index}" onclick="zoom('${esc(p.image_url)}')"
              style="width:76px;height:76px;object-fit:cover;border-radius:8px;cursor:zoom-in;flex:none">`
          : `<div class="num" style="min-width:1.8rem;padding-top:.5rem">${p.index}</div>`}
        <div style="flex:1">
          ${p.image_url ? `<div class="num">SEITE ${p.index}
            ${p.image_stale ? `<span class="flag warn"
              title="Seit dem Zeichnen geändert — das Bild zeigt noch die alte Anweisung">Bild noch alt</span>` : ""}</div>` : ""}
          <textarea rows="2" data-page="${p.index}" data-lang="${language}"
            aria-label="Text Seite ${p.index}" onchange="savePage(this)">${esc(p.text[language] || "")}</textarea>
          <label class="small muted" style="display:flex;gap:.4rem;align-items:baseline;margin-top:.3rem">
            Bild:
            <input type="text" value="${esc(p.illustration)}" title="Was die Illustration zeigt (englisch)"
              style="flex:1;font-size:.82rem;padding:.25rem .5rem"
              onchange="saveIllustration(${p.index}, this.value)">
          </label>
        </div>
        <div style="display:flex;flex-direction:column;gap:.3rem;align-items:flex-end">
          <label class="small muted" style="text-align:right">Seitenlayout
            <select style="width:auto;font-size:.78rem;padding:.2rem .4rem;display:block"
              aria-label="Layout Seite ${p.index}"
              onchange="saveLayout(${p.index}, this.value)">${layoutOptions(p.layout)}</select></label>
          <button class="btn ghost tiny" onclick="rewrite(${p.index})"
            title="Die KI schreibt Text und Bildanweisung dieser Seite neu">KI: neu</button>
        </div>
      </div>`).join("") + `</div></div>`;
}

function setEditLang(code) { S.editLang = code; renderStory(); }

async function savePage(element) {
  try {
    await api(`/api/book/books/${S.bookId}`, { method: "PUT", body: JSON.stringify({
      pages: [{ index: Number(element.dataset.page),
                text: { [element.dataset.lang]: element.value } }] }) });
    toast(`Seite ${element.dataset.page} gespeichert.`);
  } catch (exc) {
    toast(`Speichern fehlgeschlagen: ${exc.message}`);
  }
}
async function saveLayout(index, layout) {
  try {
    await api(`/api/book/books/${S.bookId}`,
      { method: "PUT", body: JSON.stringify({ pages: [{ index, layout }] }) });
    toast(`Layout von Seite ${index} gespeichert.`);
  } catch (exc) {
    toast(`Speichern fehlgeschlagen: ${exc.message}`);
  }
}
async function saveIllustration(index, illustration) {
  if (!illustration.trim()) return;
  await api(`/api/book/books/${S.bookId}`,
    { method: "PUT", body: JSON.stringify({ pages: [{ index, illustration }] }) });
  toast(`Bildanweisung für Seite ${index} gespeichert — wirkt beim nächsten Zeichnen.`);
}
function rewrite(index) {
  openModal(`<h3>Seite ${index} neu schreiben</h3>
    <label class="f"><span>Was soll anders sein? (leer lassen = einfach besser machen)</span>
      <textarea id="m-note" rows="3" placeholder="Weniger Text. Und es soll regnen."></textarea></label>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn" id="m-go">Neu schreiben</button></div>`);
  $("m-go").onclick = () => {
    const note = $("m-note").value.trim();
    closeModal();
    runJob("story_rewrite", { book_id: S.bookId, index, note }, `Seite ${index} neu`,
      () => (S.screen === "book" ? renderBook() : renderStory()));
  };
}

/* =========================================================== 4. book */

let currentBook = null;

async function renderBook() {
  const book = await api(`/api/book/books/${S.bookId}`);
  currentBook = book;
  const language = book.primary_language || book.languages[0];
  const drawn = book.pages.filter((p) => p.image).length;
  const spend = book.spend || {};
  const missing = missingEst(book);
  const perImage = perImageUsd(book.render_quality);
  const redrawAllUsd = (book.pages.length + 1) * perImage;

  const qualityPicker = `<select id="b-quality" style="width:auto" title="Bildqualität"
    onchange="setQuality(this.value)">${(S.status.render_profiles || []).map((p) => `
      <option value="${p.key}" ${book.render_quality === p.key ? "selected" : ""}>
        ${esc(p.label)} — ${eur(perImageUsd(p.key))}/Bild</option>`).join("")}</select>`;


  view().innerHTML = stepsBar("book") + `
    <div class="card">
      <div class="spread"><div>
        <h2>${esc(book.title[language] || book.display_title)}
          <button class="btn ghost tiny" style="vertical-align:middle"
            onclick="editBookMeta()">bearbeiten</button></h2>
        <p class="lede" style="margin-bottom:0">${drawn} von ${book.pages.length} Seiten gezeichnet
          ${book.flagged.length ? `· <span style="color:var(--warn)">${book.flagged.length} zum Anschauen</span>` : ""}
          ${spend.calls ? ` · <button class="meter" style="cursor:pointer"
            title="Aufschlüsselung ansehen" onclick="costDialog()">bisher
            <b>~${spend.eur.toFixed(2)} €</b> geschätzt</button>` : ""}
          ${book.export_stale && (book.exports || []).length ? ` · <span class="flag warn"
            title="Seit dem letzten Export wurde am Buch geändert">Export veraltet</span>` : ""}</p>
        <p class="small" style="margin:.5rem 0 0">${nextStep(book, missing)}</p>
      </div>
      <div class="row">
        ${drawn ? `<button class="btn ghost" onclick="openReader()">Vorlesen</button>` : ""}
        <button class="btn ghost" onclick="go('story')">Text ändern</button>
        ${pickerHtml()}${qualityPicker}
        ${missing.images
          ? `<button class="btn" onclick="illustrateAll()">
              ${drawn ? "Fehlende Bilder zeichnen" : "Bilder zeichnen"}
              (${missing.images}) · ${eur(missing.usd)}</button>`
          : `<button class="btn" onclick="redrawAll()">Alle Seiten neu zeichnen
              · ${eur(redrawAllUsd)}</button>`}
      </div></div>

      <div id="review">${referencesBanner(book)}${reviewBanners(book, perImage)}</div>

      ${book.cast.length ? `<details style="margin-top:1rem">
        <summary class="small muted">Nebenfiguren und Orte (${book.cast.length}) — bearbeiten möglich</summary>
        <div class="grid g4" style="margin-top:.7rem">` + book.cast.map((c, i) => `
          <div class="pick" style="cursor:default">
            ${c.sheet_url ? `<img src="${esc(c.sheet_url)}" alt="Referenzblatt ${esc(c.name)}"
                onclick="zoom('${esc(c.sheet_url)}')" style="cursor:zoom-in">`
                          : `<div style="aspect-ratio:3/2;background:var(--sunk)"></div>`}
            <div class="cap"><b>${esc(c.name)}</b><small>${c.kind === "place" ? "Ort" : "Figur"}
              ${c.sheet_url ? "" : " · noch kein Blatt"}</small>
              <div class="acts" style="margin-top:.4rem">
                <button class="btn ghost tiny" onclick="editCast(${i})">bearbeiten</button>
                <button class="btn ghost tiny" onclick="redrawCast(${i})"
                  title="Neues Referenzblatt · ${eur(perImageUsd('draft'))}">Blatt neu</button>
              </div></div></div>`).join("") + `</div></details>` : ""}
    </div>

    ${drawn === 0 && book.pages.length ? storyboardCard(book, language, missing) : ""}
    ${printPanel(book)}

    <div class="card" id="seiten">
      <h2>Seiten</h2>
      <div class="grid g3" style="margin-top:1rem">
        ${book.cover_url ? `<div class="page">
          <img src="${esc(book.cover_url)}" onclick="zoom('${esc(book.cover_url)}')" alt="Titelbild">
          <div class="body"><div class="num">TITELBILD</div>
            <div class="acts">
              <button class="btn ghost tiny" onclick="redrawCover()"
                title="Nur das Titelbild">neu zeichnen · ${eur(perImage)}</button>
              <button class="btn ghost tiny" onclick="editBookMeta()">Motiv ändern</button>
            </div></div></div>` : ""}
        ` + book.pages.map((p) => pageCard(p, language)).join("") + `
      </div>
    </div>

    ${drawn ? `<div id="export">${exportPanel(book)}</div>` : ""}

    <details class="card" id="tools" ${drawn && (book.pages.some((p) => (p.audio_stale || []).length)) ? "open" : ""}>
      <summary style="cursor:pointer"><b>Weitere Werkzeuge</b>
        <span class="muted small">— Vorlesen lassen, Fotoseite</span></summary>
      <div style="margin-top:1rem">
        ${drawn ? soundPanel(book) : `<p class="lede">Ton gibt es, sobald Seiten gezeichnet sind.</p>`}
        ${photoPanel(book, language)}
      </div>
    </details>

    <div class="row" style="margin-top:1.4rem;justify-content:flex-end">
      <button class="btn ghost" style="color:var(--bad)" onclick="deleteBook()">Buch löschen</button>
    </div>`;

  refreshPreflight();  // async; fills the readiness box once the answer is in
}

/* The storyboard: the last look before money is spent. Everything the
   illustrator will be told, page by page, plus the total -- and the way back
   to the editor if something reads wrong. */
function storyboardCard(book, language, missing) {
  const rows = book.pages.map((p) => `
    <tr style="border-bottom:1px solid var(--line);vertical-align:top">
      <td class="num" style="padding:.4rem .5rem .4rem 0">${p.index}</td>
      <td style="padding:.4rem .8rem .4rem 0">${esc((p.text[language] || "—").slice(0, 90))}</td>
      <td class="small muted" style="padding:.4rem .8rem .4rem 0">${esc(p.illustration.slice(0, 90))}</td>
      <td class="small muted" style="white-space:nowrap">${esc(p.layout)}${
        p.cast.length ? ` · ${p.cast.map(esc).join(", ")}` : ""}</td>
    </tr>`).join("");
  return `<div class="card">
    <h2>Storyboard — vor dem ersten Zeichnen prüfen</h2>
    <p class="lede">So wird der Illustrator gebrieft. Liest sich eine Zeile falsch,
      ist Ändern jetzt kostenlos — nach dem Zeichnen kostet jede Korrektur ein Bild.
      Insgesamt: <b>${missing.images} Bilder, ${eur(missing.usd)}</b>.</p>
    <div style="overflow-x:auto"><table class="small" style="width:100%;border-collapse:collapse">
      <tr class="muted"><th style="text-align:left;padding-right:.5rem">Nr</th>
        <th style="text-align:left">Text</th><th style="text-align:left">Bildanweisung</th>
        <th style="text-align:left">Layout · Figuren</th></tr>
      ${rows}</table></div>
    <div class="row" style="margin-top:1rem">
      <button class="btn ghost" onclick="go('story')">Noch etwas ändern</button>
      <button class="btn" onclick="illustrateAll()">Passt — zeichnen (${missing.images} · ${eur(missing.usd)})</button>
    </div></div>`;
}

/* The proof sheet: every page in order, compact, with exactly the numbers a
   print decision needs -- faster than scrolling a wall of cards. */
function proofDialog() {
  const book = currentBook;
  const presetKey = $("e-preset")?.value || "print_square";
  const preset = (S.status.print_presets || []).find((p) => p.key === presetKey) || {};
  const language = book.primary_language || book.languages[0];
  const pageMm = presetKey === "print_kinderbuch" ? 162 : 222.25;  // incl. bleed
  const isPrint = !!preset.bleed;
  const dpi = (px) => Math.round(px / (pageMm / 25.4));
  const cells = book.pages.map((p) => {
    const d = p.image_px ? dpi(p.image_px) : null;
    const marks = [
      p.error ? "Fehler" : "",
      p.check_status === "failed" ? "prüfen" : "",
      (p.check_status === "unknown" || p.check_status === "unchecked") ? "ungeprüft" : "",
      p.image_stale ? "Bild veraltet" : "",
      isPrint && d && d < 280 ? `${d} dpi` : "",
    ].filter(Boolean);
    return `<div style="border:1px solid ${marks.length ? "var(--warn)" : "var(--line)"};
        border-radius:8px;overflow:hidden">
      ${p.image_url ? `<img src="${esc(p.image_url)}" alt="Seite ${p.index}"
        style="aspect-ratio:1;object-fit:cover">`
        : `<div style="aspect-ratio:1;background:var(--sunk);display:grid;place-items:center"
            class="small muted">fehlt</div>`}
      <div class="small" style="padding:.3rem .45rem">
        <b>${p.index}</b> ${esc((p.text[language] || "").slice(0, 40))}
        ${marks.length ? `<div style="color:var(--warn)">${marks.map(esc).join(" · ")}</div>` : ""}
      </div></div>`;
  }).join("");
  openModal(`<h3>Druckbogen — ${esc(preset.name || presetKey)}</h3>
    <div class="grid g4" style="margin-bottom:1rem">${cells}</div>
    <p class="small muted">Gelb gerahmte Seiten brauchen einen Blick, bevor gedruckt wird.</p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Schließen</button></div>`);
}

// One plain sentence saying what to do next -- the antidote to a screen with
// nine buttons on it.
function nextStep(book, missing) {
  const review = book.review || { failed: [], unknown: [], errors: [] };
  if (missing.images) {
    return `Als Nächstes: ${missing.images} fehlende${missing.images === 1 ? "s" : ""} Bild${missing.images === 1 ? "" : "er"} zeichnen.`;
  }
  if (review.failed.length + review.errors.length) {
    return `Als Nächstes: die beanstandeten Seiten ansehen — <a href="#review">zu den Hinweisen</a>.`;
  }
  if (review.unknown.length) {
    return `Als Nächstes: die ungeprüften Seiten prüfen lassen — <a href="#review">zu den Hinweisen</a>.`;
  }
  if (book.export_stale && (book.exports || []).length) {
    return `Als Nächstes: neu exportieren, der Text ist neuer als die Dateien — <a href="#export">zum Export</a>.`;
  }
  if (!(book.exports || []).length) {
    return `Alles gezeichnet. Als Nächstes: anhören („Vorlesen“) oder <a href="#export">exportieren</a>.`;
  }
  return "Fertig — Dateien sind exportiert und aktuell.";
}

/* A book is frozen to the references it was made with. When the hero or the
   style has moved on since, that is worth a calm note -- and an explicit
   button, never an automatic switch. */
function referencesBanner(book) {
  const refs = book.references || {};
  const reasons = [];
  if (refs.hero_changed) reasons.push("die Figur hat inzwischen ein anderes Charakterblatt");
  if (refs.style_changed) reasons.push("der Stil wurde inzwischen neu gezeichnet");
  if (refs.style_missing) reasons.push("der Stil dieses Buches wurde gelöscht — das Buch behält seine eigene Kopie");
  if (!reasons.length) return "";
  const canAdopt = refs.hero_changed || refs.style_changed;
  return `<div class="banner" style="margin-top:1.1rem">
    Dieses Buch zeichnet mit seiner <b>eingefrorenen</b> Referenz weiter,
    denn ${reasons.join(", ")}. Bestehende Seiten ändern sich dadurch nie von selbst.
    ${canAdopt ? `<div style="margin-top:.6rem"><button class="btn ghost tiny"
      onclick="adoptReferences()">Auf die neue Referenz umstellen</button>
      <span class="small muted">— wirkt erst beim nächsten Zeichnen; schon
      gezeichnete Seiten bleiben, bis du sie neu zeichnest.</span></div>` : ""}
  </div>`;
}

/* The header figure, opened up: what exactly was paid for. Every image and
   audio call leaves a ledger entry server-side; text calls (story, checks)
   cost cents at most and are billed against free contingents, so they are
   noted rather than counted. */
function costDialog() {
  const spend = currentBook?.spend || {};
  const nice = { pages: "Seitenbilder", cover: "Titelbild", narration: "Ton",
                 scout: "Bilddienst-Vergleich", cast: "Nebenfiguren-Blätter" };
  const rows = Object.entries(spend.by || {}).map(([what, b]) => `
    <tr><td>${esc(nice[what] || what)}</td>
      <td style="text-align:right">${b.calls}×</td>
      <td style="text-align:right">${eur(b.usd)}</td></tr>`).join("");
  const recent = (spend.entries || []).slice(-12).reverse().map((e) => `
    <tr><td class="muted">${esc(nice[e.what] || e.what)}</td>
      <td class="muted">${esc(e.model || "")}</td>
      <td style="text-align:right">${eur(e.usd)}</td></tr>`).join("");
  openModal(`<h3>Kosten dieses Buchs — ~${(spend.eur ?? 0).toFixed(2)} €</h3>
    <table class="small" style="width:100%;border-collapse:collapse;margin-bottom:1rem">
      ${rows || `<tr><td class="muted">Noch nichts ausgegeben.</td></tr>`}
    </table>
    ${recent ? `<details><summary class="small muted">Letzte Einzelposten</summary>
      <table class="small" style="width:100%;border-collapse:collapse;margin-top:.5rem">${recent}</table>
    </details>` : ""}
    <p class="small muted" style="margin-top:.8rem">Alles Schätzwerte auf Basis der
      Listenpreise (BFL meldet exakt). Text-Aufrufe — Geschichte, Überarbeitung,
      Prüfungen — kosten Centbeträge und sind hier nicht mitgezählt.</p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Schließen</button></div>`);
}

/* Cast corrections: the story generator invents the recurring cast, and it
   sometimes gets a name, a description or a page list wrong. This is where a
   person fixes it -- including regenerating just the one reference sheet. */
function editCast(index) {
  const member = currentBook.cast[index];
  if (!member) return;
  const pageChips = currentBook.pages.map((p) => `
    <label class="chip ${(member.pages || []).includes(p.index) ? "on" : ""}">
      <input type="checkbox" value="${p.index}"
        ${(member.pages || []).includes(p.index) ? "checked" : ""}
        onchange="this.parentNode.classList.toggle('on',this.checked)">${p.index}</label>`).join("");
  openModal(`<h3>${esc(member.name)} bearbeiten</h3>
    <label class="f"><span>Name</span>
      <input type="text" id="m-cname" value="${esc(member.name)}"></label>
    <label class="f"><span>Beschreibung (englisch, fürs Zeichnen)</span>
      <textarea id="m-cdesc" rows="3">${esc(member.description)}</textarea></label>
    <label class="f"><span>Kommt vor auf den Seiten</span></label>
    <div class="chips" id="m-cpages" style="margin-bottom:1rem">${pageChips}</div>
    <p class="small muted">Nach einer geänderten Beschreibung das Blatt neu zeichnen
      lassen — sonst zeigt die Referenz weiter die alte Fassung.</p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" style="color:var(--bad)" id="m-cremove">Entfernen</button>
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn" id="m-csave">Speichern</button></div>`);
  $("m-csave").onclick = async () => {
    const pages = [...$("m-cpages").querySelectorAll("input:checked")].map((i) => Number(i.value));
    await api(`/api/book/books/${S.bookId}`, { method: "PUT", body: JSON.stringify({
      cast: [{ index, name: $("m-cname").value, description: $("m-cdesc").value, pages }] }) });
    closeModal(); toast("Gespeichert."); renderBook();
  };
  $("m-cremove").onclick = () => {
    closeModal();
    confirmModal(`${member.name} aus dem Buch entfernen?`,
      "Die Figur verschwindet von allen Seitenlisten; schon gezeichnete Bilder bleiben, bis sie neu gezeichnet werden.",
      "Entfernen", async () => {
        await api(`/api/book/books/${S.bookId}`, { method: "PUT",
          body: JSON.stringify({ cast: [{ index, remove: true }] }) });
        toast("Entfernt."); renderBook();
      });
  };
}

function redrawCast(index) {
  runJob("cast_redraw", { book_id: S.bookId, cast_index: index, ...drawParams() },
    "Referenzblatt wird gezeichnet", renderBook);
}

async function adoptReferences() {
  await api(`/api/book/books/${S.bookId}`,
    { method: "PUT", body: JSON.stringify({ adopt_references: true }) });
  toast("Referenz übernommen — neue Zeichnungen folgen jetzt dem aktuellen Stand.");
  renderBook();
}

// Failed and unknown checks are different problems with different fixes:
// failed pages get redrawn (costs images), unknown pages get re-checked
// (costs a vision call). One banner each, so the action matches the problem.
function reviewBanners(book, perImage) {
  const review = book.review || { failed: book.flagged || [], unknown: [], errors: [] };
  const trouble = [...review.failed, ...review.errors];
  const pageLinks = (list) => list.map((i) => `<a href="#page-${i}">${i}</a>`).join(", ");
  let html = "";
  if (trouble.length) {
    html += `<div class="banner" style="margin-top:1.1rem" role="alert">
      Auf ${trouble.length === 1 ? "einer Seite" : `${trouble.length} Seiten`}
      stimmt etwas nicht (Figur, Szene oder der Zeichenversuch selbst):
      Seite ${pageLinks(trouble)}. Jede geprüfte davon wurde schon einmal
      automatisch nachgezeichnet — das hier blieb übrig.
      <div style="margin-top:.6rem"><button class="btn ghost tiny"
        onclick="illustrate(true, [${trouble.join(",")}])">
        Alle ${trouble.length} neu zeichnen · ${eur(trouble.length * perImage)}</button></div>
    </div>`;
  }
  if (review.unknown.length) {
    html += `<div class="banner" style="margin-top:${trouble.length ? ".6rem" : "1.1rem"}">
      ${review.unknown.length === 1 ? "Eine Seite ist" : `${review.unknown.length} Seiten sind`}
      <b>ungeprüft</b> — die Ähnlichkeitsprüfung brach ab, bevor sie urteilen
      konnte: Seite ${pageLinks(review.unknown)}. Die Bilder können völlig in
      Ordnung sein; verifiziert hat sie nur niemand.
      <div style="margin-top:.6rem"><button class="btn ghost tiny"
        onclick="recheck([${review.unknown.join(",")}])">
        Jetzt prüfen — kostet keine Bilder, nur einen Blick</button></div>
    </div>`;
  }
  return html;
}

function recheck(only) {
  runJob("book_check", { book_id: S.bookId, only: only || [] },
    "Seiten werden geprüft", renderBook);
}

async function setQuality(key) {
  await api(`/api/book/books/${S.bookId}`,
    { method: "PUT", body: JSON.stringify({ render_quality: key }) });
  toast("Bildqualität umgestellt — sie gilt für alles, was ab jetzt gezeichnet wird.");
  renderBook();
}

function setBackend(name) { store.set("imageBackend", name); render(); }
function setModel(key) { store.set("imageModel." + currentBackend(), key); render(); }

/* The confirm for the two expensive runs, with an optional spending ceiling:
   the job stops queueing new pages once the ceiling is crossed. */
function bigRunModal(title, detail, verb, params, jobTitle) {
  // Gemini can run the whole batch at half price, if you can wait for it.
  const gemini = currentBackend() === "gemini";
  const count = (currentBook?.pages.length || 0) + 1;
  const profile = params.render_quality || currentBook?.render_quality || "draft";
  const batchUsd = count * perImageUsd(profile) * 0.5;
  openModal(`<h3>${esc(title)}</h3>
    <p class="lede">${esc(detail)} Wird eine Seite von der Prüfung beanstandet,
      kostet die automatische Wiederholung je ein weiteres Bild.</p>
    ${gemini ? `<label class="check" style="margin-bottom:1rem">
      <input type="checkbox" id="m-batch">
      <span><b>Batch-Modus: ${eur(batchUsd)} statt des vollen Preises.</b>
      Google zeichnet alles in einem Rutsch, wann es Kapazität hat — Minuten
      bis Stunden statt sofort. Keine automatische Wiederholung; beanstandete
      Seiten bleiben markiert.</span></label>` : ""}
    <label class="f" style="max-width:260px"><span>Kostendeckel in € (leer = keiner)</span>
      <input type="number" id="m-budget" min="0" step="0.5" placeholder="z. B. 3"></label>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn" id="m-go">${esc(verb)}</button></div>`);
  $("m-go").onclick = () => {
    const eurCap = parseFloat($("m-budget").value);
    const batch = !!$("m-batch")?.checked;
    closeModal();
    const budget = Number.isFinite(eurCap) && eurCap > 0
      ? { budget_usd: eurCap * (est().usd_per_eur || 1.08) } : {};
    runJob("book_illustrate",
      { book_id: S.bookId, ...params, ...budget, ...(batch ? { batch: true } : {}),
        ...drawParams() },
      batch ? `${jobTitle} (Batch)` : jobTitle, renderBook);
  };
}

function redrawAll() {
  const book = currentBook;
  const usd = (book.pages.length + 1) * perImageUsd(book.render_quality);
  bigRunModal("Wirklich alle Seiten neu zeichnen?",
    `${book.pages.length} Seiten und das Titelbild, in der eingestellten Qualität — zusammen ${eur(usd)}. Die bisherigen Fassungen bleiben als Versionen erhalten.`,
    "Alles neu zeichnen", { redraw: true }, "Bilder werden gezeichnet");
}

function redrawCover() {
  runJob("book_illustrate", { book_id: S.bookId, cover_only: true, ...drawParams() },
    "Titelbild wird gezeichnet", renderBook);
}

// The print-readiness check: are the drawn pictures big enough for 300 dpi?
function printPanel(book) {
  const drawnPages = book.pages.filter((p) => p.image_px);
  if (!drawnPages.length) return "";
  // The square print preset: 21.6 cm trim plus 3.175 mm bleed on both sides.
  const pageMm = 215.9 + 2 * 3.175;
  const dpi = (px) => Math.round(px / (pageMm / 25.4));
  const worst = Math.min(...drawnPages.map((p) => dpi(p.image_px)));
  const weak = drawnPages.filter((p) => dpi(p.image_px) < 280).length;
  if (!weak) {
    return `<div class="card"><h2>Reif für die Druckerei</h2>
      <p class="lede" style="margin-bottom:0">Alle gezeichneten Seiten liegen bei etwa
        <b>${worst} dpi</b> und mehr — genug für die 300 dpi, die eine Druckerei will.</p></div>`;
  }
  const usd = (book.pages.length + 1) * perImageUsd("print");
  return `<div class="card"><h2>Noch nicht reif für die Druckerei</h2>
    <p class="lede">Eine Druckerei will 300 dpi („dots per inch“ — Druckpunkte pro Zoll).
      ${weak} von ${drawnPages.length} gezeichneten Seiten liegen darunter, die schwächste
      bei etwa <b>${worst} dpi</b>. Am Bildschirm fällt das nicht auf, im Druck wird es weich.
      Zum Vorlesen am Bildschirm reicht es so.</p>
    <button class="btn ghost" onclick="rerenderPrint()">
      Alles in Druckqualität neu zeichnen · ${eur(usd)}</button></div>`;
}

function rerenderPrint() {
  const book = currentBook;
  const usd = (book.pages.length + 1) * perImageUsd("print");

  drop.ondrop = async (e) => { e.preventDefault(); drop.classList.remove("over");
    await uploadPhotoPage([...e.dataTransfer.files][0]); };
  file.onchange = () => uploadPhotoPage(file.files[0]);

// Just enough Markdown for the handoff sheet: headings, lists, tables, bold.
function mdToHtml(md) {
  const inline = (t) => esc(t)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/`(.+?)`/g, "<code>$1</code>")
    .replace(/_(.+?)_/g, "<i>$1</i>");
  let html = "", list = null, table = false;
  const closeAll = () => {
    if (list) { html += `</${list}>`; list = null; }
    if (table) { html += "</table>"; table = false; }
  };
  for (const line of md.split("\n")) {
    if (/^\|[\s\-|]+\|\s*$/.test(line)) continue;  // table separator row
    if (/^\|/.test(line)) {
      if (!table) { closeAll(); table = true;
        html += `<table class="small" style="border-collapse:collapse;margin:.4rem 0">`; }
      html += "<tr>" + line.split("|").slice(1, -1).map((cell) =>
        `<td style="padding:.15rem .8rem .15rem 0;vertical-align:top">${inline(cell.trim())}</td>`).join("") + "</tr>";
    } else if (/^#+\s/.test(line)) {
      closeAll();
      const level = Math.min(line.match(/^#+/)[0].length + 2, 5);
      html += `<h${level} style="margin:.9rem 0 .3rem">${inline(line.replace(/^#+\s*/, ""))}</h${level}>`;
    } else if (/^\s*[-*]\s/.test(line)) {
      if (list !== "ul") { closeAll(); list = "ul"; html += `<ul class="small" style="margin:.2rem 0;padding-left:1.2rem">`; }
      html += `<li>${inline(line.replace(/^\s*[-*]\s*/, ""))}</li>`;
    } else if (/^\s*\d+\.\s/.test(line)) {
      if (list !== "ol") { closeAll(); list = "ol"; html += `<ol class="small" style="margin:.2rem 0;padding-left:1.2rem">`; }
      html += `<li>${inline(line.replace(/^\s*\d+\.\s*/, ""))}</li>`;
    } else if (!line.trim()) {
      closeAll();
    } else {
      closeAll();
      html += `<p class="small" style="margin:.3rem 0">${inline(line)}</p>`;
    }
  }
  closeAll();
  return html;
}

/* The Setzprobe: the page as the export will actually set it -- same layout
   engine, same font logic, at screen resolution. Until now the exported PDF
   was the first typeset thing anyone saw. */
const setPreview = { index: 0 };

function typesetPreview(index) {
  setPreview.index = index ?? 0;
  openModal(`<h3>Setzprobe — so wird die Seite gesetzt</h3>
    <div id="sp-stage" style="text-align:center;min-height:280px;display:grid;place-items:center">
      <p class="lede">Seite wird gesetzt …</p></div>
    <div class="row" style="justify-content:center;margin-top:.7rem">
      <button class="btn ghost tiny" onclick="turnSetPreview(-1)">◀</button>
      <span class="small muted" id="sp-count" style="min-width:9rem;text-align:center"></span>
      <button class="btn ghost tiny" onclick="turnSetPreview(1)">▶</button>
    </div>
    <p class="small muted" id="sp-legend" style="margin:.6rem 0 0"></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Schließen</button></div>`);
  loadSetPreview();
}

function turnSetPreview(step) {
  const last = currentBook?.pages.length || 0;
  setPreview.index = Math.max(0, Math.min(last, setPreview.index + step));
  loadSetPreview();
}

async function loadSetPreview() {
  const stage = $("sp-stage");
  if (!stage) return;
  stage.innerHTML = `<p class="lede">Seite wird gesetzt …</p>`;
  const query = new URLSearchParams({
    preset: $("e-preset")?.value || "screen",
    font: $("e-font")?.value || "georgia",
    index: setPreview.index,
  });
  // Mirror the export: combined -> all chosen languages on the page,
  // otherwise the first chosen language alone.
  const chosen = [...($("e-langs")?.querySelectorAll("input:checked") || [])].map((i) => i.value);
  const langs = $("e-combine")?.checked ? chosen : chosen.slice(0, 1);
  for (const code of langs) query.append("languages", code);

  let result;
  try { result = await api(`/api/book/books/${S.bookId}/page-preview?${query}`); }
  catch (exc) { stage.innerHTML = `<p class="lede">Setzen fehlgeschlagen: ${esc(exc.message)}</p>`; return; }
  stage.innerHTML = `<img src="${esc(result.url)}" alt="Gesetzte Seite"
    style="max-width:100%;max-height:58vh;object-fit:contain;border:1px solid var(--line);
    border-radius:6px;cursor:zoom-in" onclick="zoom('${esc(result.url)}')">`;
  const count = $("sp-count");
  if (count) count.textContent = setPreview.index === 0
    ? "Titelseite" : `Seite ${setPreview.index} von ${result.pages}`;
  const legend = $("sp-legend");
  if (legend) legend.textContent = result.print
    ? "Rote Linie: hier schneidet die Druckerei. Blaue Linie: Sicherheitsabstand — aller Text bleibt innerhalb."
    : "";
}

/* The readiness gate. The server enforces the same check inside the export
   job -- this fetch exists so the user sees WHY before pressing anything. */
let preflightState = null;

async function refreshPreflight() {
  if (!S.bookId || !$("preflight")) return;
  const query = new URLSearchParams({ preset: $("e-preset")?.value || "print_square",
                                      font: $("e-font")?.value || "georgia" });
  for (const input of $("e-langs")?.querySelectorAll("input:checked") || []) {
    query.append("languages", input.value);
  }
  let report;
  try { report = await api(`/api/book/books/${S.bookId}/preflight?${query}`); }
  catch { return; }
  preflightState = report.state;
  renderPreflightBox(report);
}

function renderPreflightBox(report) {
  const box = $("preflight");
  if (!box) return;
  const heads = {
    "bereit": ["var(--good)", "Bereit für den Export."],
    "warnung": ["var(--warn)", "Export möglich — mit Abstrichen:"],
    "unbekannt": ["var(--warn)", "Prüfung unbekannt — es gibt ungeprüfte Seiten:"],
    "unvollständig": ["var(--bad)", "Noch nicht exportbereit:"],
  };
  const [colour, head] = heads[report.state] || heads["unvollständig"];
  const line = (text, mark) => `<li>${mark} ${esc(text)}</li>`;
  const items =
    report.errors.map((t) => line(t, "✗")).join("")
    + report.unknowns.map((t) => line(t, "?")).join("")
    + report.warnings.map((t) => line(t, "⚠")).join("");
  const jump = [
    ...report.pages_missing, ...report.pages_failed_check, ...report.pages_unknown_check,
  ];
  const links = [...new Set(jump)].sort((a, b) => a - b)
    .map((i) => `<a href="#page-${i}">Seite ${i}</a>`).join(" · ");

  box.innerHTML = `<div style="border:1px solid ${colour};border-radius:10px;
      padding:.7rem .9rem;margin-bottom:1.1rem">
    <b style="color:${colour}">${head}</b>
    ${items ? `<ul style="margin:.4rem 0 0;padding-left:1.2rem" class="small">${items}</ul>` : ""}
    ${links ? `<div class="small" style="margin-top:.4rem">Direkt hin: ${links}</div>` : ""}
    ${report.state === "unbekannt" ? `<label class="check small" style="margin-top:.5rem">
      <input type="checkbox" id="e-allow-unknown" onchange="applyPreflightGate()">
      Trotzdem exportieren — ich übernehme das Ansehen der ungeprüften Seiten selbst</label>` : ""}
  </div>`;
  applyPreflightGate();
}

function applyPreflightGate() {
  const go = $("e-go");
  if (!go) return;
  const blocked = preflightState === "unvollständig"
    || (preflightState === "unbekannt" && !$("e-allow-unknown")?.checked);
  go.disabled = blocked;
  go.title = blocked ? "Erst die Punkte oben lösen — der Export würde ein kaputtes Buch bauen." : "";
}

function doExport() {
  const languages = [...$("e-langs").querySelectorAll("input:checked")].map((i) => i.value);
  if (!languages.length) return toast("Mindestens eine Sprache auswählen.");
  runJob("book_export", { book_id: S.bookId, preset: $("e-preset").value,
    font: $("e-font").value, provider_hint: $("e-shop").value, languages,
    combine: !!$("e-combine")?.checked,
    allow_unknown: !!$("e-allow-unknown")?.checked },
    "PDF wird gebaut", renderBook);
}

function addLanguage() {
  const have = currentBook ? currentBook.languages : [];
  const options = (S.status.languages || []).filter((l) => !have.includes(l.code));
  if (!options.length) return toast("Alle verfügbaren Sprachen sind schon drin.");
  openModal(`<h3>Sprache dazu</h3>
    <p class="lede">Die Bilder bleiben dieselben; die Geschichte wird in der neuen
      Sprache eigenständig geschrieben, nicht übersetzt. Kostet nur Centbeträge.</p>
    <div class="chips" style="margin-bottom:1.2rem">${options.map((l) => `
      <label class="chip"><input type="checkbox" value="${l.code}"
        onchange="this.parentNode.classList.toggle('on',this.checked)">${esc(l.name)}</label>`).join("")}
    </div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn" id="m-go">Schreiben</button></div>`);
  $("m-go").onclick = () => {
    const languages = [...$("modal").querySelectorAll("input:checked")].map((i) => i.value);
    if (!languages.length) return toast("Mindestens eine Sprache anhaken.");
    closeModal();
    runJob("story_languages", { book_id: S.bookId, languages },
      "Wird geschrieben", renderBook);
  };
}

async function restoreDialog() {
  const { backups } = await api("/api/book/backups");
  if (!backups.length) {
    return toast("Keine Sicherungen gefunden — ZIPs gehören in library/backups.");
  }
  openModal(`<h3>Buch wiederherstellen</h3>
    <p class="lede">Jede Sicherung wird vor dem Einspielen geprüft (Manifest und
      Prüfsummen). Existiert das Buch noch, entsteht eine Kopie — überschrieben
      wird nie.</p>
    ${backups.map((b) => `<div class="row" style="padding:.3rem 0">
      <button class="btn ghost tiny" onclick="doRestore('${esc(b.file)}')">wiederherstellen</button>
      <span class="small">${esc(b.name)}</span>
      <span class="small muted">${b.size_kb} KB</span></div>`).join("")}
    <div class="row" style="justify-content:flex-end;margin-top:.8rem">
      <button class="btn ghost" onclick="closeModal()">Schließen</button></div>`);
}

async function doRestore(file) {
  closeModal();
  try {
    const result = await api("/api/book/restore",
      { method: "POST", body: JSON.stringify({ file }) });
    toast(`„${result.title}“ wiederhergestellt — ${result.files} Dateien geprüft.`);
    renderHome();
  } catch (exc) {
    toast(`Wiederherstellen abgelehnt: ${exc.message}`);
  }
}

async function backupBook() {
  const info = await api(`/api/book/books/${S.bookId}/backup`, { method: "POST" });
  toast(`Gesichert — ${info.size_kb} KB. Der Download startet.`);
  const link = document.createElement("a");
  link.href = info.url; link.download = "";
  document.body.appendChild(link); link.click(); link.remove();
}

/* =========================================================== read aloud */

const reader = { index: 0, pages: [], playing: false, auto: false, timer: null };

function openReader() {
  const book = currentBook;
  if (!book) return;
  reader.pages = book.pages.filter((p) => p.image_url);
  if (!reader.pages.length) return toast("Es gibt noch keine gezeichneten Seiten.");
  $("r-lang").innerHTML = book.languages.map((code) => {
    const name = (S.status.languages.find((l) => l.code === code) || {}).name || code;
    return `<option value="${code}">${esc(name)}</option>`;
  }).join("") + (book.languages.length > 1
    ? `<option value="__all">alle zusammen</option>` : "");
  const saved = store.get("readerLang");
  if (saved && (book.languages.includes(saved)
      || (saved === "__all" && book.languages.length > 1))) $("r-lang").value = saved;
  reader.index = 0;
  reader.auto = false;
  $("r-auto").classList.remove("on");
  $("reader").classList.add("on");
  document.addEventListener("keydown", readerKeys);
  showPage(0);
}

function closeReader() {
  $("reader").classList.remove("on");
  document.removeEventListener("keydown", readerKeys);
  const audio = $("r-audio"); audio.pause(); reader.playing = false;
  reader.auto = false; clearTimeout(reader.timer);
  $("r-auto").classList.remove("on");
}

function readerLangChanged() {
  store.set("readerLang", $("r-lang").value);
  showPage(reader.index);
}

function readerKeys(event) {
  if (event.key === "Escape") closeReader();
  if (event.key === "ArrowRight" || event.key === " ") { event.preventDefault(); turn(1); }
  if (event.key === "ArrowLeft") turn(-1);
}

function showPage(index) {
  clearTimeout(reader.timer);
  reader.index = Math.max(0, Math.min(reader.pages.length - 1, index));
  const page = reader.pages[reader.index];
  const language = $("r-lang").value;
  $("r-img").src = page.image_url;
  let track;
  if (language === "__all") {  // every language stacked, for bilingual reading
    const codes = currentBook.languages;
    $("r-text").textContent = codes.map((c) => page.text[c]).filter(Boolean).join("\n");
    track = codes.map((c) => (page.audio_urls || {})[c]).find(Boolean);
  } else {
    $("r-text").textContent = page.text[language] || "";
    track = (page.audio_urls || {})[language];
  }
  $("r-count").textContent = `${reader.index + 1} / ${reader.pages.length}`;
  const audio = $("r-audio");
  $("r-play").style.opacity = track ? "1" : ".4";
  $("r-play").disabled = !track;
  audio.pause();
  reader.playing = false;
  $("r-play").textContent = "▶ Vorlesen";
  if (track) audio.src = track;
  if (reader.auto) playCurrent();
}

function turn(step) {
  const next = reader.index + step;
  if (next < 0 || next >= reader.pages.length) return;
  showPage(next);
}

function toggleAudio() {
  const audio = $("r-audio");
  if (!audio.src) return;
  if (reader.playing) { audio.pause(); reader.playing = false; $("r-play").textContent = "▶ Vorlesen"; }
  else { audio.play(); reader.playing = true; $("r-play").textContent = "❚❚ Pause"; }
}

/* Autoplay: read the page, turn it, read the next. Pages without audio (for
   example a wordless spread) get a few seconds of looking time instead. */
function toggleAuto() {
  reader.auto = !reader.auto;
  $("r-auto").classList.toggle("on", reader.auto);
  if (reader.auto) playCurrent();
  else { clearTimeout(reader.timer); $("r-audio").pause();
         reader.playing = false; $("r-play").textContent = "▶ Vorlesen"; }
}

function playCurrent() {
  clearTimeout(reader.timer);
  const audio = $("r-audio");
  if (audio.src && !$("r-play").disabled) {
    audio.play(); reader.playing = true; $("r-play").textContent = "❚❚ Pause";
  } else {
    reader.timer = setTimeout(advanceAuto, 4000);
  }
}

function advanceAuto() {
  if (!reader.auto) return;
  if (reader.index >= reader.pages.length - 1) { toggleAuto(); return; }
  turn(1);  // showPage sees reader.auto and keeps the chain going
}

$("r-audio").onended = () => {
  reader.playing = false; $("r-play").textContent = "▶ Vorlesen";
  if (reader.auto) advanceAuto();
};

/* =========================================================== boot */

// Panels are re-rendered wholesale, so drag-and-drop has to be re-wired after
// every render rather than bound once at load.
const observer = new MutationObserver(() => wirePhotoPage());
observer.observe($("view"), { childList: true, subtree: false });

(async function boot() {
  try { S.status = await api("/api/book/status"); }
  catch (exc) {
    view().innerHTML = `<div class="banner bad">Server nicht erreichbar: ${esc(exc.message)}</div>`;
    return;
  }
  if (S.status.active_job) {
    S.job = S.status.active_job;
    S.poll = setInterval(pollJob, 900);
    drawer(true, true);
  }
  render();
})();
</script>
