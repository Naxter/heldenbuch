<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heldenbuch — Bilderbücher selber machen</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon-open-book.svg">
<meta name="theme-color" content="#f8f0dc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130e" media="(prefers-color-scheme: dark)">
<style>
:root{
  color-scheme:light dark;
  /* The palette is the banner's: parchment ground, navy ink, gold accents.
     Backgrounds stay beige -- navy appears only as ink, never as a surface.
     Every text/background pair is measured at or above the WCAG 4.5:1
     floor, UI boundaries above 3:1; gold never carries text on light
     panels (3.9:1) -- --warn is the text-safe gold. Re-measure before
     changing any of these. */
  --bg:#f8f0dc; --panel:#fffbef; --sunk:#f0e5c8; --fg:#15263c; --muted:#5b6169;
  --line:#e3d6b6; --accent:#1e4269; --accent-soft:#f3e0b4; --accent-fg:#fff;
  --good:#26694a; --bad:#9c3125; --warn:#7d5509;
  --control-line:#79765f;
  --brand-ink:#011e3f;
  --shadow:0 1px 2px rgba(60,45,25,.06),0 8px 24px rgba(60,45,25,.06);
}
/* The dark tokens exist twice: once for the system preference (skipped when
   the user forced light in the settings) and once for a forced dark choice.
   Keep both blocks identical. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16130e; --panel:#201c15; --sunk:#191610; --fg:#efe8dc; --muted:#a2988a;
    --line:#342e23; --accent:#cc8e1e; --control-line:#6b6355; --accent-soft:#33261a; --accent-fg:#1b1610;
    --good:#63d094; --bad:#ef8b7f; --warn:#e3ba63;
    --brand-ink:#efe8dc;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16130e; --panel:#201c15; --sunk:#191610; --fg:#efe8dc; --muted:#a2988a;
  --line:#342e23; --accent:#cc8e1e; --control-line:#6b6355; --accent-soft:#33261a; --accent-fg:#1b1610;
  --good:#63d094; --bad:#ef8b7f; --warn:#e3ba63;
  --brand-ink:#efe8dc;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light;}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.6 "Segoe UI",-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
a{color:var(--accent);}
h1,h2,h3{line-height:1.25;margin:0;}
/* Headings set in the wordmark's serif; UI text stays sans. */
h1,h2{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.01em;}
button{font:inherit;}

header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.head{max-width:1180px;margin:0 auto;padding:.85rem 1.25rem;display:flex;align-items:center;gap:1rem;}
.brand{display:flex;align-items:center;gap:.65rem;cursor:pointer;}
.brand .brandmark{height:2.1rem;width:auto;display:block;}
.brand span{font-size:.8rem;color:var(--muted);align-self:end;padding-bottom:.15rem;}
.head .right{margin-left:auto;display:flex;align-items:center;gap:.9rem;font-size:.82rem;}
.head .right a{color:var(--muted);text-decoration:none;}
.head .right a:hover{color:var(--fg);}
.iconbtn{background:none;border:none;padding:.3rem;color:var(--muted);cursor:pointer;
  display:grid;place-items:center;border-radius:8px;}
.iconbtn:hover{color:var(--fg);background:var(--sunk);}

/* The dashboard strip on the home screen. */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;
  margin-bottom:1.6rem;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:.85rem 1rem;box-shadow:var(--shadow);}
.stat b{display:block;font-size:1.5rem;font-family:Georgia,"Times New Roman",serif;}
.stat span{font-size:.78rem;color:var(--muted);}
.stat .pills{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem;}
.stat .pill{font-size:.72rem;padding:.1rem .5rem;border-radius:99px;
  border:1px solid var(--line);color:var(--muted);}
.stat .pill.ok{color:var(--good);border-color:currentColor;}
main{max-width:1180px;margin:0 auto;padding:1.75rem 1.25rem 8rem;}

.steps{display:flex;gap:.4rem;margin-bottom:1.75rem;flex-wrap:wrap;}
.step{display:flex;align-items:center;gap:.5rem;padding:.4rem .8rem .4rem .45rem;border-radius:99px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:.85rem;
  cursor:pointer;transition:.15s;}
.step .n{width:1.45rem;height:1.45rem;border-radius:50%;background:var(--sunk);color:var(--muted);
  display:grid;place-items:center;font-size:.75rem;font-weight:700;}
.step.on{border-color:var(--accent);color:var(--fg);}
.step.on .n{background:var(--accent);color:var(--accent-fg);}
.step.done .n{background:var(--good);color:#fff;}
.step[disabled]{opacity:.45;cursor:not-allowed;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.4rem;
  box-shadow:var(--shadow);}
.card + .card{margin-top:1.1rem;}
.card h2{font-size:1.15rem;margin-bottom:.3rem;}
.lede{color:var(--muted);font-size:.92rem;margin:0 0 1.2rem;max-width:62ch;}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;}
.spread{display:flex;gap:1rem;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;}
.grid{display:grid;gap:1rem;}
.g2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));}
.g3{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));}
.g4{grid-template-columns:repeat(auto-fill,minmax(165px,1fr));}
.muted{color:var(--muted);} .small{font-size:.85rem;} .hide{display:none !important;}

label.f{display:block;margin-bottom:1rem;}
label.f > span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:.3rem;}
input[type=text],input[type=number],select,textarea{
  width:100%;padding:.6rem .7rem;font:inherit;font-size:.95rem;color:var(--fg);
  background:var(--bg);border:1px solid var(--line);border-radius:9px;}
textarea{resize:vertical;line-height:1.55;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;
  border-color:transparent;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.check{display:inline-flex;align-items:center;gap:.5rem;font-size:.9rem;cursor:pointer;}
.check input{width:auto;accent-color:var(--accent);}
.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.6rem 1.05rem;border-radius:10px;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);
  font-weight:600;font-size:.93rem;cursor:pointer;transition:.12s;}
.btn:hover{filter:brightness(1.06);}
.btn:active:not(:disabled){transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line);font-weight:500;}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn.tiny{padding:.3rem .6rem;font-size:.8rem;border-radius:7px;}

.chips{display:flex;flex-wrap:wrap;gap:.45rem;}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .75rem;border-radius:99px;
  border:1px solid var(--line);background:var(--panel);font-size:.88rem;cursor:pointer;user-select:none;}
/* Hidden but focusable: display:none took the checkboxes out of the tab
   order, and these chips spend money. */
.chip{position:relative;}
.chip input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
.chip:focus-within{outline:2px solid var(--accent);outline-offset:2px;}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600;}

.pick{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden;
  cursor:pointer;transition:.15s;text-align:left;padding:0;color:inherit;width:100%;
  position:relative;}
.xdel{position:absolute;top:.45rem;right:.45rem;z-index:2;width:1.6rem;height:1.6rem;
  border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  cursor:pointer;font-size:.9rem;line-height:1;opacity:0;transition:.15s;}
.pick:hover .xdel{opacity:1;}
.xdel:hover{color:var(--bad);border-color:var(--bad);}
.pick:hover{border-color:var(--accent);transform:translateY(-1px);}
.pick.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.pick img{width:100%;aspect-ratio:3/2;object-fit:contain;background:var(--sunk);display:block;}
.pick.tall img{aspect-ratio:1;object-fit:cover;}
.pick .cap{padding:.6rem .75rem;}
.pick .cap b{display:block;font-size:.92rem;}
.pick .cap small{color:var(--muted);font-size:.79rem;}

.drop{border:2px dashed var(--line);border-radius:12px;padding:1.6rem;text-align:center;
  background:var(--sunk);cursor:pointer;transition:.15s;}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);}
.thumbs{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem;}
.thumbs img{width:74px;height:74px;object-fit:cover;border-radius:9px;border:1px solid var(--line);}

.page{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;}
.page img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--sunk);cursor:zoom-in;}

/* While an image is on its way, its tile shimmers instead of sitting grey;
   once loaded (the delegated listener adds .ok) it fades in and the
   animation stops, so a finished grid costs no compositing. */
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes imgin{from{opacity:0}to{opacity:1}}
.tome-cover img:not(.ok),.page img:not(.ok){
  background:linear-gradient(100deg,var(--sunk) 40%,var(--panel) 50%,var(--sunk) 60%);
  background-size:200% 100%;animation:shimmer 1.4s linear infinite;}
.tome-cover img.ok,.page img.ok,.pick img.ok,.thumbs img.ok{animation:imgin .3s ease;}
.page .body{padding:.7rem .8rem;}
.page .num{font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.04em;}
.page .acts{display:flex;gap:.35rem;margin-top:.45rem;flex-wrap:wrap;}
.flag{display:inline-block;padding:.12rem .45rem;border-radius:6px;font-size:.72rem;font-weight:700;}
.flag.warn{background:var(--accent-soft);color:var(--warn);}
.flag.bad{background:var(--accent-soft);color:var(--bad);}
.flag.calm{background:var(--sunk);color:var(--muted);}
.notes{margin:.4rem 0 0;padding-left:1rem;font-size:.78rem;color:var(--warn);}

#drawer:not(.open){visibility:hidden;}
#drawer{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);
  border-top:1px solid var(--line);box-shadow:0 -8px 32px rgba(60,45,25,.10);
  transform:translateY(100%);transition:transform .22s ease;}
#drawer.open{transform:none;}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem;padding:.7rem 1.25rem;max-width:1180px;margin:0 auto;}
.dhead .title{font-weight:600;font-size:.93rem;}
.dhead .right{margin-left:auto;display:flex;gap:.5rem;align-items:center;}
#dlog{max-width:1180px;margin:0 auto;padding:0 1.25rem 1rem;height:0;overflow:auto;
  font-family:ui-monospace,Consolas,monospace;font-size:.79rem;line-height:1.55;
  white-space:pre-wrap;color:var(--muted);transition:height .22s ease;}
#drawer.tall #dlog{height:min(42vh,360px);}
.spinner{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;flex:none;}
#dprog{flex:1;max-width:240px;height:5px;border-radius:3px;background:var(--sunk);
  overflow:hidden;position:relative;}
#dprog>div{height:100%;background:var(--accent);border-radius:3px;transition:width .5s;}
#dprog.indeterminate>div{width:32% !important;position:absolute;
  animation:slide 1.4s ease-in-out infinite;}
@keyframes slide{0%{left:-32%;}100%{left:100%;}}
#dcount{font-size:.8rem;color:var(--muted);white-space:nowrap;}
#derror{max-width:1180px;margin:0 auto;padding:0 1.25rem .9rem;}
#derror .inner{border:1px solid var(--bad);border-radius:10px;padding:.7rem .9rem;
  font-size:.88rem;white-space:pre-line;}
@keyframes spin{to{transform:rotate(360deg);}}
.dot{width:9px;height:9px;border-radius:50%;flex:none;}

.empty{text-align:center;padding:3.5rem 1rem;color:var(--muted);}
.empty h2{font-size:1.4rem;color:var(--fg);margin-bottom:.5rem;}
.banner{padding:.8rem 1rem;border-radius:10px;background:var(--accent-soft);color:var(--warn);
  font-size:.88rem;margin-bottom:1.2rem;}
.banner.bad{color:var(--bad);}
dialog{border:none;border-radius:14px;padding:0;background:var(--panel);max-width:94vw;
  box-shadow:var(--shadow);}
dialog img{display:block;max-width:92vw;max-height:88vh;}
dialog::backdrop{background:rgba(30,22,12,.82);}
/* the lightbox: one picture, the whole screen, nothing else */
dialog#viewer{background:transparent;box-shadow:none;max-width:100vw;max-height:100vh;
  width:100vw;height:100vh;margin:0;}
#viewer img{width:100vw;height:100vh;max-width:100vw;max-height:100vh;object-fit:contain;
  cursor:zoom-out;}
#viewer .vbar{position:fixed;top:1rem;right:1rem;display:flex;gap:.5rem;}
#viewer .vbar button{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);
  color:#f6efe2;border-radius:9px;padding:.45rem .8rem;cursor:pointer;font-size:.85rem;}
#viewer .vbar button:hover{background:rgba(0,0,0,.75);}
.xzoom{position:absolute;top:.45rem;left:.45rem;z-index:2;width:1.6rem;height:1.6rem;
  border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  cursor:zoom-in;font-size:.8rem;line-height:1;opacity:0;transition:.15s;}
.pick:hover .xzoom{opacity:1;}
.xzoom:hover{color:var(--accent);border-color:var(--accent);}
.file{display:flex;gap:.8rem;align-items:center;border:1px solid var(--line);
  border-radius:10px;padding:.65rem .85rem;background:var(--bg);}
.file .ficon{font-size:1.5rem;flex:none;}
dialog.modal{padding:1.4rem;width:min(94vw,620px);color:var(--fg);}
dialog.modal h3{font-size:1.1rem;margin-bottom:.8rem;}
dialog.modal img{max-width:100%;max-height:none;width:100%;border-radius:9px;
  border:1px solid var(--line);cursor:zoom-in;}
dialog.modal .vlabel{font-size:.75rem;color:var(--muted);margin-top:.3rem;display:block;}
#toast{position:fixed;bottom:4.6rem;left:50%;transform:translateX(-50%);z-index:70;
  background:var(--fg);color:var(--bg);padding:.55rem 1rem;border-radius:99px;
  font-size:.88rem;box-shadow:var(--shadow);max-width:88vw;}
.bookcard img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--sunk);}
/* the bookshelf: covers first, everything else steps back */
.shelf{display:grid;gap:1.5rem 1.3rem;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));}
.tome{position:relative;cursor:pointer;transition:transform .18s;}
.tome:hover,.tome:focus-visible{transform:translateY(-4px);}
.tome-cover{position:relative;border-radius:10px;overflow:hidden;
  box-shadow:0 8px 22px rgba(60,45,25,.20),0 2px 6px rgba(60,45,25,.14);}
.tome-cover img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--sunk);}
.tome-blank{width:100%;aspect-ratio:1;background:var(--sunk);display:grid;place-items:center;
  color:var(--muted);padding:1rem;text-align:center;font-style:italic;}
.tome-read{position:absolute;inset:0;margin:auto;width:3.4rem;height:3.4rem;border-radius:50%;
  border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.55);color:#fff;
  font-size:1.25rem;cursor:pointer;opacity:0;transition:.15s;}
.tome:hover .tome-read,.tome:focus-within .tome-read{opacity:1;}
.tome-read:hover{background:var(--accent);}
.tome-chip{position:absolute;top:.6rem;left:.6rem;background:rgba(0,0,0,.55);color:#fff;
  padding:.18rem .6rem;border-radius:99px;font-size:.72rem;}
.tome-cap{padding:.65rem .15rem 0;}
.tome-cap b{display:block;font-size:.95rem;line-height:1.3;}
.meter{display:inline-flex;align-items:baseline;gap:.35rem;font-size:.8rem;color:var(--muted);
  border:1px solid var(--line);border-radius:99px;padding:.2rem .65rem;}
.meter b{color:var(--fg);font-size:.88rem;}

/* ---------------------------------------------------------- read aloud */
#reader{position:fixed;inset:0;z-index:60;background:#0d0b07;display:none;
  align-items:center;justify-content:center;flex-direction:column;}
#reader.on{display:flex;}
#reader .sheet{max-width:min(96vw,calc(88vh * 1.0));max-height:88vh;position:relative;}
#reader img{max-width:100%;max-height:78vh;border-radius:10px;display:block;
  box-shadow:0 20px 60px rgba(0,0,0,.6);}
#reader .words{color:#f6efe2;font-size:clamp(1rem,2.2vw,1.5rem);line-height:1.5;
  text-align:center;margin:1rem auto 0;max-width:46ch;text-shadow:0 2px 12px rgba(0,0,0,.7);
  white-space:pre-line;}
#reader .bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:.6rem;align-items:center;
  justify-content:center;padding:1rem;background:linear-gradient(transparent,rgba(0,0,0,.65));}
#reader .bar button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  color:#f6efe2;border-radius:10px;padding:.5rem .9rem;cursor:pointer;font-size:.9rem;}
#reader .bar button:hover{background:rgba(255,255,255,.22);}
#reader .bar button.on{background:var(--accent);border-color:var(--accent);}
#reader .counter{color:#cbbfa9;font-size:.85rem;min-width:5rem;text-align:center;}
#reader .close{position:fixed;top:1rem;right:1rem;}
</style>
</head>
<body>

<header>
  <div class="head">
    <div class="brand" onclick="go('home')">
      <!-- Inline so the inks can follow the theme; the gold stays gold. -->
      <svg class="brandmark" viewBox="60 55 700 200" role="img" aria-label="Heldenbuch">
        <text x="410" y="164" text-anchor="middle"
          style="fill:var(--brand-ink);font-family:Georgia,'Times New Roman',serif;font-size:130px;letter-spacing:-6px">heldenbuch</text>
        <path fill="none" stroke="#cc8e1e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
          d="M78 190C174 175 278 174 358 188C386 193 402 202 410 218C418 202 434 193 462 188C542 174 646 175 742 190"/>
        <path fill="none" stroke="var(--brand-ink)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
          d="M78 210C180 200 282 201 360 211C386 214 403 224 410 240C417 224 434 214 460 211C538 201 640 200 742 210"/>
      </svg>
      <span id="tagline">Bilderbücher selber machen</span>
    </div>
    <div class="right">
      <a href="#" id="nav-books" onclick="go('home');return false">Meine Bücher</a>
      <a href="/benchmark" id="nav-lab" title="Technischer Vergleich der Bildmodelle">Labor</a>
      <button class="iconbtn" id="settings-btn" onclick="openSettings()" aria-label="Einstellungen">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main id="view"></main>

<div id="drawer">
  <div class="dhead">
    <div class="spinner hide" id="dspin"></div>
    <div class="dot hide" id="ddot"></div>
    <div class="title" id="dtitle">Bereit</div>
    <div id="dprog" class="hide" role="progressbar" aria-valuemin="0"
         aria-valuemax="100" aria-valuenow="0"><div style="width:0%"></div></div>
    <span id="dcount"></span>
    <!-- Written only on real transitions. The old region carried the
         elapsed seconds and was rewritten by a 900 ms poll, so a screen
         reader announced it about once a second for the whole render and
         nothing else could be heard. -->

"use strict";

/* =========================================================== plumbing */

const $ = (id) => document.getElementById(id);
// The apostrophe matters: a handful of interpolations sit inside single-quoted
// JavaScript string literals in onclick attributes, where a bare ' closes the
// string early.
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Grid tiles ask the server for its cached thumbnail; only the reader and
// the zoom view fetch originals, which are print files of several megabytes.
const tn = (u) => (u ? u + (u.includes("?") ? "&" : "?") + "thumb=1" : u);
const view = () => $("view");

// Marks images as loaded so the CSS can stop their placeholder shimmer.
// Capture phase, because load events on images do not bubble.
document.addEventListener("load", (event) => {
  if (event.target.tagName === "IMG") event.target.classList.add("ok");
}, true);

// A failed save used to throw before closeModal()/toast(), so the dialog
// just sat there unchanged -- indistinguishable from a click that never
// registered, and the edits vanished on Abbrechen.
window.addEventListener("unhandledrejection", (event) => {
  const message = event.reason?.message || String(event.reason || "");
  if (message) toast(ti("action_failed", { message }));
  console.error(event.reason);
});

async function api(path, options = {}) {
  const response = await fetch(path, {
    headers: { "Content-Type": "application/json" }, ...options,
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
  return payload;
}

const store = {
  get(key, fallback = null) {
    try { return JSON.parse(localStorage.getItem("heldenbuch." + key)) ?? fallback; }
    catch { return fallback; }
  },
  set(key, value) { localStorage.setItem("heldenbuch." + key, JSON.stringify(value)); },
};

function toast(message) {
  const el = $("toast");
  // Unhide first, then set the text a frame later: a live region whose text
  // changes while it is display:none is never announced.
  el.classList.remove("hide");
  el.textContent = "";
  requestAnimationFrame(() => { el.textContent = message; });
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.add("hide"), 3500);
}

// Turns an estimated dollar amount into the "~0,30 €" a button shows.

function eur(usd) {
  const rate = S.status?.estimates?.usd_per_eur || 1.08;
  // The decimal separator follows the interface language, not the currency:
  // "0,60 €" is right in German and wrong in English.
  return `~${(usd / rate).toLocaleString(uiLang, {
    minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`;
}
function est() { return S.status?.estimates || {}; }
function profileEst(key) {
  const profile = (S.status?.render_profiles || []).find((p) => p.key === key);
  return profile?.est_usd ?? 0.06;
}
/* Which image service and model draw this book. The choice is per action:
   pick a model, then redraw one page with it, and only that page uses it. */
function currentBackend() {
  const ready = (S.status?.image_backends || []).filter((b) => b.ready).map((b) => b.name);
  const saved = store.get("imageBackend");
  if (saved && ready.includes(saved)) return saved;
  const scouted = currentBook?.style?.recommended_backend;  // the scout's pick
  if (scouted && ready.includes(scouted)) return scouted;
  return ready.includes("openai") ? "openai" : (ready[0] || "openai");
}
function modelsFor(backend) {
  return (S.status?.image_models || []).filter((m) => m.backend === backend);
}
function currentModelInfo() {
  const models = modelsFor(currentBackend());
  const saved = store.get("imageModel." + currentBackend());
  return models.find((m) => m.key === saved) || models[0] || null;
}
// per-image price for the chosen service/model at a render profile
function perImageUsd(profileKey) {
  const model = currentModelInfo();
  if (!model) return profileEst(profileKey);
  if (model.pricing === "flat") {
    return profileKey === "print" ? (model.usd_print ?? model.usd) : model.usd;
  }
  return profileEst(profileKey) * (model.factor ?? 1);
}
function drawParams() {
  const model = currentModelInfo();
  return { backend: currentBackend(), ...(model ? { model: model.key } : {}) };
}
// Sheets are drawn at high quality, previews at medium -- price them for the
// chosen service and model.
function sheetUsd() {
  const m = currentModelInfo();
  if (!m) return est().sheet_usd || 0.22;
  return m.pricing === "flat" ? m.usd : (est().sheet_usd || 0.22) * (m.factor ?? 1);
}
function previewUsd() {
  const m = currentModelInfo();
  if (!m) return est().preview_usd || 0.06;
  return m.pricing === "flat" ? m.usd : (est().preview_usd || 0.06) * (m.factor ?? 1);
}
// The service/model choice, as a compact control any drawing screen can show.
function pickerHtml() {
  const ready = (S.status?.image_backends || []).filter((b) => b.ready);
  const models = modelsFor(currentBackend());

      onchange="setBackend(this.value)">${ready.map((b) => `<option value="${b.name}"
        ${b.name === currentBackend() ? "selected" : ""}>${esc(b.name)}</option>`).join("")}</select>` : ""}
    ${models.length > 1 ? `<select style="width:auto" title="Bildmodell"
      onchange="setModel(this.value)">${models.map((m) => `<option value="${m.key}"
        ${m.key === currentModelInfo()?.key ? "selected" : ""}>${esc(m.label)}</option>`).join("")}</select>` : ""}
  </span>`;
}

/* Resolution, in one place. This lived in three, and the copies that
   mattered assumed the square preset's geometry no matter which format was
   selected -- so the smaller epubli format was judged against the wrong
   page width. The server sends each preset's real page size. */
function printPresets() { return S.status?.print_presets || []; }

function presetFor(key) {
  const all = printPresets();
  return all.find((p) => p.key === key)
      || all.find((p) => p.key === "print_square")
      || { key: "print_square", page_mm: 215.9 + 2 * 3.175, dpi: 300, bleed: true };
}

//: the format the export panel is currently set to, or the print default
function selectedPreset() {
  return presetFor($("e-preset")?.value || "print_square");
}

function dpiFor(px, preset) {
  const mm = preset?.page_mm || (215.9 + 2 * 3.175);
  return px ? Math.round(px / (mm / 25.4)) : null;
}

//: below this a print shop's 300 dpi is not honestly reachable
const DPI_FLOOR = 280;

// What "draw the missing pictures" would cost for this book right now.
function missingEst(book) {
  const perImage = perImageUsd(book.render_quality);
  const pages = book.pages.filter((p) => !p.image_url).length;
  const cover = book.cover_url ? 0 : 1;
  const cast = (book.cast || []).filter((c) => !c.sheet_url).length;
  return { images: pages + cover + cast,
           usd: (pages + cover) * perImage + cast * perImageUsd("draft") };
}

function readFile(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve({ name: file.name, data: reader.result });
    reader.readAsDataURL(file);
  });
}

function drawer(open, tall) {
  $("drawer").classList.toggle("open", open);
  if (tall !== undefined) $("drawer").classList.toggle("tall", tall);
}
$("dtoggle").onclick = () => $("drawer").classList.toggle("tall");
$("dclose").onclick = () => drawer(false, false);
$("dcancel").onclick = async () => {
  if (S.job) await api(`/api/jobs/${S.job}/cancel`, { method: "POST" });
};

// Every paid action goes through here, and none of them used to disable
// their button. A second click while the POST was in flight drew -- and
// paid for -- the same images twice.
let jobStarting = false;
/* The drawer, made ready for a job that is about to be watched. Split out
   because a retry is started by the server, not by this browser, and still
   has to land in the same drawer with the same bookkeeping. */
function prepareDrawer(title, onDone) {
  $("dlog").textContent = "";
  $("dtitle").textContent = title;
  $("dtitle").dataset.job = title;
  $("dspin").classList.remove("hide");
  $("ddot").classList.add("hide");
  $("dcancel").classList.remove("hide");
  $("dclose").classList.add("hide");
  $("dprog").classList.add("hide");
  $("dcount").textContent = "";
  $("derror").classList.add("hide");
  drawer(true, true);
  // The drawer follows the newest job, but an earlier one that is still
  // queued or running must keep its completion callback.
  if (S.job) S.watch.push({ id: S.job, onDone: S.onDone });
  S.seen = 0;
  S.onDone = onDone;
}

function attachJob(job, title, onDone) {
  prepareDrawer(title, onDone);
  S.job = job.id;
  clearInterval(S.poll);
  S.poll = setInterval(pollJob, 900);
  pollJob();
}

async function runJob(action, params, title, onDone) {
  if (jobStarting) return;
  jobStarting = true;
  const trigger = window.event?.currentTarget;
  if (trigger) trigger.disabled = true;
  prepareDrawer(title, onDone);

  try {
    const job = await api("/api/jobs", {
      method: "POST", body: JSON.stringify({ action, ...params }),
    });
    S.job = job.id;
    clearInterval(S.poll);
    S.poll = setInterval(pollJob, 900);
    pollJob();
  } catch (exc) {
    $("dlog").textContent = exc.message;
    $("dspin").classList.add("hide");
    $("dclose").classList.remove("hide");
  } finally {
    jobStarting = false;
    if (trigger) trigger.disabled = false;
  }
}

async function pollJob() {
  pollWatch();
  if (!S.job) return;
  let job;
  try {
    job = await api(`/api/jobs/${S.job}?since=${S.seen}`);
    S.pollFails = 0;
  } catch (exc) {
    // The job keeps running and keeps spending; only this browser lost
    // sight of it. One dropped keep-alive used to detach the UI for good
    // and label a healthy render "Fehler".
    S.pollFails = (S.pollFails || 0) + 1;
    if (S.pollFails < 10) {
      $("dtitle").textContent = "Verbindung unterbrochen — versuche erneut …";
      return;
    }
    appendLog(`Verbindung verloren: ${exc.message}`);
    appendLog("Der Auftrag läuft weiter. Seite neu laden, um wieder mitzulesen.");
    return endJob(null);
  }

  if (job.lines.length) { S.seen = job.total_lines; appendLog(job.lines.join("\n")); }
  const name = JOB_NAMES[job.action] || job.action;
  $("dtitle").textContent = job.status === "queued"
    ? `${name} — wartet (${job.queued_behind} vor dir)`
    : `${name} · ${Math.round(job.elapsed)}s`;

  // The bar: real progress when the worker reports it, a wandering shimmer
  // while a model is thinking and there is nothing to count yet.
  const bar = $("dprog");
  if (job.status === "running") {
    bar.classList.remove("hide");
    if (job.progress && job.progress.total) {
      bar.classList.remove("indeterminate");
      const percent = Math.round(100 * job.progress.done / job.progress.total);
      bar.firstElementChild.style.width = `${percent}%`;
      bar.setAttribute("aria-valuenow", String(percent));
      bar.setAttribute("aria-valuetext",
        `${job.progress.done} von ${job.progress.total} fertig`);
      $("dcount").textContent = `${job.progress.done} / ${job.progress.total}`;
      // Spoken once per finished page, not once per poll.
      if (job.progress.done !== S.saidDone) {
        S.saidDone = job.progress.done;
        say(`${job.progress.done} von ${job.progress.total} fertig`);
      }
    } else {
      bar.classList.add("indeterminate");
      $("dcount").textContent = "";
    }
  }

  // Finished pages appear on the book screen while the rest are still drawn.
  if (job.status === "running" && S.screen === "book"
      && (job.action === "book_illustrate" || job.action === "book_check")
      && (pollJob.tick = (pollJob.tick || 0) + 1) % 4 === 0) {
    patchDrawnPages();
  }

  if (job.status !== "running" && job.status !== "queued") endJob(job);
}

/* Swap "noch nicht gezeichnet" placeholders for finished pictures in place --
   no full re-render, so nothing jumps while the user watches. */
async function patchDrawnPages() {
  if (!S.bookId) return;
  let book;
  try { book = await api(`/api/book/books/${S.bookId}`); } catch { return; }
  currentBook = book;
  for (const page of book.pages) {
    const card = document.getElementById(`page-${page.index}`);
    if (!card) continue;
    const placeholder = card.querySelector("div.small.muted");
    if (page.image_url && !card.querySelector("img")) {
      const img = document.createElement("img");
      img.src = page.image_url;
      img.alt = ti("page_illustration_alt", { n: page.index });
      img.onclick = () => zoom(page.image_url);
      placeholder?.replaceWith(img);
    } else if (!page.image_url && placeholder) {
      placeholder.textContent = t("page_being_drawn");
    }
  }
}

async function pollWatch() {
  for (const watched of [...S.watch]) {
    try {
      const job = await api(`/api/jobs/${watched.id}?since=999999`);
      if (job.status === "running" || job.status === "queued") continue;
      S.watch = S.watch.filter((w) => w !== watched);
      if (watched.onDone) watched.onDone(job);
    } catch { S.watch = S.watch.filter((w) => w !== watched); }
  }
}

function appendLog(text) {
  const log = $("dlog");
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  log.textContent += (log.textContent ? "\n" : "") + text;
  if (atBottom) log.scrollTop = log.scrollHeight;
}

function say(message){ const el=$("dsay"); if(el) el.textContent=message; }
function endJob(job) {
  clearInterval(S.poll); S.poll = null; S.job = null;
  // A cancelled queued job can finish before an older running one: keep
  // polling quietly until every watched job has reported back.
  if (S.watch.length) {
    S.poll = setInterval(async () => {
      await pollWatch();
      if (!S.watch.length && !S.job) { clearInterval(S.poll); S.poll = null; }
    }, 1200);
  }
  $("dspin").classList.add("hide");
  $("dcancel").classList.add("hide");
  $("dclose").classList.remove("hide");

  const dot = $("ddot");
  dot.classList.remove("hide");
  const ok = job && job.status === "done";
  dot.style.background = ok ? "var(--good)"
    : (job && job.status === "cancelled" ? "var(--warn)" : "var(--bad)");
  const verdict = ok ? "Fertig"
    : (job ? ({ cancelled: "Abgebrochen", failed: "Fehlgeschlagen" }[job.status] || job.status)
           : "Fehler");
  $("dtitle").textContent = verdict;
  say(`${$("dtitle").dataset.job || "Auftrag"}: ${verdict}`);
  S.saidDone = -1;
  $("dprog").classList.add("hide");
  $("dcount").textContent = "";
  if (ok) $("drawer").classList.remove("tall");

  // A failure gets its explanation front and centre -- the advice lives in
  // the error text itself now, not in a log line someone has to find.
  if (job && job.status === "failed" && job.error) {
    $("derror").querySelector(".inner").textContent = job.error;
    $("derror").classList.remove("hide");
    $("drawer").classList.add("tall");
  }

  const callback = S.onDone; S.onDone = null;
  if (callback && job) callback(job);
}

/* The job center: every queued, running and recent job in one place, with a
   retry for failures. The drawer follows only the newest job; this is where
   an overlapping second job stays visible and understandable. */
const JOB_NAMES = {
  hero_create: "Figur zeichnen", hero_more: "Weitere Varianten",
  style_try: "Stil ausprobieren", style_adopt: "Stil einrichten",
  style_scout: "Bilddienste vergleichen", voice_preview: "Stimmprobe",
  story_write: "Geschichte schreiben", story_rewrite: "Seite neu schreiben",
  story_languages: "Sprache dazu", book_illustrate: "Bilder zeichnen",
  book_check: "Seiten prüfen", book_undo: "Seite zurück",
  book_photo: "Fotoseite", book_narrate: "Ton erzeugen", book_export: "PDF bauen",
};
const JOB_STATES = {
  queued: ["wartet", "var(--warn)"], running: ["läuft", "var(--accent)"],
  done: ["fertig", "var(--good)"], failed: ["fehlgeschlagen", "var(--bad)"],
  cancelled: ["abgebrochen", "var(--muted)"],
};

async function jobCenter() {
  let status;
  try { status = await api("/api/book/status"); } catch { return; }
  const jobs = status.jobs || [];
  const rows = jobs.map((job) => {
    const [word, colour] = JOB_STATES[job.status] || [job.status, "var(--muted)"];
    const queuePos = job.status === "queued" && job.queued_behind
      ? ` — ${job.queued_behind} davor` : "";
    const canRetry = job.status === "failed";
    const canCancel = job.status === "running" || job.status === "queued";
    return `<tr>
      <td>${esc(JOB_NAMES[job.action] || job.action)}</td>
      <td style="color:${colour};white-space:nowrap">${word}${queuePos}</td>
      <td class="muted" style="text-align:right;white-space:nowrap">${Math.round(job.elapsed)}s</td>
      <td style="text-align:right;white-space:nowrap">
        ${canCancel ? `<button class="btn ghost tiny" onclick="cancelJob('${job.id}')">abbrechen</button>` : ""}
        ${canRetry ? `<button class="btn ghost tiny" onclick="retryJob('${job.id}')">erneut</button>` : ""}
        ${job.status === "failed" && job.error ? `<span class="small muted" title="${esc(job.error)}">warum?</span>` : ""}
      </td></tr>`;
  }).join("");
  openModal(`<h3>Aufträge</h3>
    ${jobs.length ? `<table class="small" style="width:100%;border-collapse:collapse">
      ${rows}</table>` : `<p class="lede">Gerade läuft nichts.</p>`}
    <p class="small muted" style="margin-top:.8rem">Es läuft immer nur ein Auftrag —
      alles weitere wartet in der Reihe und geht dann von selbst los.</p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Schließen</button></div>`);
}

async function cancelJob(id) {
  await api(`/api/jobs/${id}/cancel`, { method: "POST" });
  toast("Wird abgebrochen.");
  closeModal();
}

async function retryJob(id) {
  // The server re-submits: it still has the uploads, which the status
  // endpoint redacts. Resubmitting from here retried a hero with no photos.
  const job = await api(`/api/jobs/${id}/retry`, { method: "POST" });
  closeModal();
  attachJob(job, `${JOB_NAMES[job.action] || job.action} — neuer Versuch`,
            () => render());
}

/* =========================================================== navigation */

const STEPS = [
  { key: "hero", label: "Held" }, { key: "look", label: "Stil" },
  { key: "story", label: "Geschichte" }, { key: "book", label: "Buch" },
];

function pageTitle(screen) {
  const b = typeof currentBook !== "undefined" ? currentBook : null;
  if (screen === "book" && b) {
    const language = b.primary_language || (b.languages || [])[0];
    const name = (b.title || {})[language] || b.display_title;
    if (name) return `${name} — Heldenbuch`;
  }
  const known = { hero: 1, look: 1, story: 1, book: 1 };
  return known[screen] ? `${t("step_" + screen)} — Heldenbuch`
                       : `Heldenbuch — ${t("tagline")}`;
}

function go(screen) {
  S.screen = screen;
  render();
  document.title = pageTitle(screen);
  // Only real screen changes animate; the per-second job re-renders go
  // through render() directly and must not flicker.
  view().animate?.(
    [{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }],
    { duration: 200, easing: "ease-out" });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function stepsBar(current) {
  const reached = { hero: true, look: !!S.heroId,
                    story: !!S.heroId && !!S.styleId, book: !!S.bookId };
  return `<div class="steps">` + STEPS.map((step, i) => `
    <button class="step ${step.key === current ? "on" : ""} ${reached[step.key] && step.key !== current ? "done" : ""}"
      ${reached[step.key] ? "" : "disabled"} onclick="go('${step.key}')">
      <span class="n">${i + 1}</span>${t("step_" + step.key)}
    </button>`).join("") + `</div>`;
}

function render() {
  return ({ home: renderHome, hero: renderHero, look: renderLook,
            story: renderStory, book: renderBook }[S.screen] || renderHome)();
}

// What each capability needs, in words a person can act on.
const CAPABILITY_HELP = {
  writing: ["Geschichten schreiben", "einen OPENAI_API_KEY (oder Anthropic/Gemini) in die Datei .env eintragen"],
  drawing: ["Bilder zeichnen", "einen Bilddienst-Schlüssel in .env eintragen (OPENAI_API_KEY reicht) — oder lokal ComfyUI starten"],
  style_analysis: ["Stil aus einem Bild ableiten", "denselben Text-Schlüssel wie fürs Schreiben"],
  narration: ["Vorlesen (Ton erzeugen)", "einen OPENAI_API_KEY — nur die Sprachausgabe braucht genau diesen"],
};

function capabilityChecklist() {
  const caps = S.status?.capabilities || {};
  const missing = Object.entries(CAPABILITY_HELP).filter(([key]) => caps[key] === false);
  if (!missing.length) return "";
  const working = Object.entries(CAPABILITY_HELP).filter(([key]) => caps[key]);
  return `<div class="banner" role="alert">
    <b>Noch nicht alles ist einsatzbereit</b> — was geht, geht trotzdem:
    <ul class="small" style="margin:.4rem 0 0;padding-left:1.2rem">
      ${working.map(([, [name]]) => `<li>✓ ${esc(name)}</li>`).join("")}

}

async function recheckSetup() {
  try { S.status = await api("/api/book/status"); } catch {}

async function renderHome() {
  const [{ books }, { heroes }] = await Promise.all([
    api("/api/book/books"), api("/api/book/heroes"),
  ]);

  const warn = capabilityChecklist();

  if (!books.length && !heroes.length) {
    view().innerHTML = warn + `
      <div class="empty">
        <h2>Noch kein Buch da.</h2>
        <p class="lede" style="margin:0 auto 1.6rem">

          und dann drucke ich es dir zusammen.</p>
        <button class="btn" onclick="startNew()">Erstes Buch anfangen</button>
      </div>`;
    return;
  }

  // Making a second book with a hero who already exists skips the two slow,
  // expensive steps entirely.
  const shortcuts = heroes.filter((h) => h.sheet).map((h) => `
    <button class="btn ghost tiny" onclick="newBookWith('${h.id}')">Neues Buch mit ${esc(h.name || "…")}</button>
  `).join("");

  const drawn = books.reduce((n, b) => n + (b.drawn || 0), 0);
  const services = S.status.image_backends || [];
  view().innerHTML = warn + `
    <div class="spread" style="margin-bottom:1.2rem;align-items:center">

      </div>

      <span class="small muted">${t("quick_start")}</span>
      ${shortcuts}

/* One book on the shelf: the cover carries it. Hovering offers reading
   straight away -- the shelf is for the child as much as for the maker. */
function bookTile(b) {
  const langs = b.languages.map(langName).join(", ");
  const unfinished = b.drawn < b.pages;
  return `<div class="tome" role="button" tabindex="0"
      aria-label="„${esc(b.title)}“ öffnen" onclick="openBook('${b.id}')">
    <div class="tome-cover">
      ${b.cover_url ? `<img src="${esc(tn(b.cover_url))}" loading="lazy" decoding="async" alt="Titelbild von ${esc(b.title)}">`
                    : `<div class="tome-blank">${esc(b.title)}</div>`}
      ${b.drawn ? `<button class="tome-read" title="Sofort vorlesen"
        aria-label="„${esc(b.title)}“ vorlesen"
        onclick="event.stopPropagation();readBook('${b.id}')">▶</button>` : ""}
      ${unfinished ? `<span class="tome-chip">${b.drawn
        ? `${b.drawn}/${b.pages} gezeichnet` : "in Arbeit — noch ungezeichnet"}</span>` : ""}
    </div>
    <div class="tome-cap"><b>${esc(b.title)}</b>
      <small class="muted">${esc(langs)}</small></div>
  </div>`;
}

async function readBook(id) {
  await openBook(id);
  setTimeout(() => openReader(), 450);
}

function startNew() { S.bookId = null; store.set("bookId", null); go("hero"); }

async function newBookWith(heroId) {
  S.heroId = heroId; store.set("heroId", heroId);
  S.bookId = null; store.set("bookId", null);
  const { styles } = await api(`/api/book/styles?hero=${heroId}`);
  if (styles.length === 1) {
    // One compatible style: take it, but say so out loud.
    S.styleId = styles[0].id; store.set("styleId", S.styleId);
    toast(`Stil „${styles[0].name}“ übernommen — ändern jederzeit unter „Stil“.`);
    go("story");
  } else if (styles.length > 1) {
    // Several: the choice is real, so it has to be made, not guessed.
    S.styleId = null; store.set("styleId", null);
    go("look");
  } else {
    go("look");
  }
}

async function openBook(id) {
  S.bookId = id; store.set("bookId", id);
  const book = await api(`/api/book/books/${id}`);
  S.heroId = book.hero_id; store.set("heroId", book.hero_id);
  S.styleId = book.style_id; store.set("styleId", book.style_id);
  go("book");
}

function deleteHero(id) {
  confirmModal(t("hero_delete_q"), t("hero_delete_detail"),
    t("delete"), async () => {
      await api(`/api/book/heroes/${id}`, { method: "DELETE" });
      if (S.heroId === id) { S.heroId = null; store.set("heroId", null);
        S.styleId = null; store.set("styleId", null); }
      toast(t("hero_deleted")); renderHero();
    });
}

function wirePhotoDrop() {
  const drop = $("h-drop"), input = $("h-file");
  drop.onclick = () => input.click();
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over");
    takePhotos([...e.dataTransfer.files]); };
  input.onchange = () => takePhotos([...input.files]);
  // Deliberately NOT clearing pendingPhotos here: this runs on every re-render
  // of the screen, and switching the image service must not discard uploads.
  renderThumbs();
}

async function takePhotos(files) {
  // Append, so choosing photos twice does not silently discard the first batch.
  const images = files.filter((f) => f.type.startsWith("image/"));
  const fresh = await Promise.all(images.map(readFile));
  pendingPhotos = pendingPhotos.concat(fresh).slice(0, 4);
  renderThumbs();
}

function renderThumbs() {
  $("h-thumbs").innerHTML = pendingPhotos.map((p, i) => `
    <img src="${p.data}" alt="" title="${t("hero_photo_remove")}"
      style="cursor:pointer" onclick="dropPhoto(${i})">`).join("");
}

function dropPhoto(index) { pendingPhotos.splice(index, 1); renderThumbs(); }

function createHero() {
  const description = $("h-desc").value.trim();
  if (!pendingPhotos.length && !description) {
    toast(t("hero_need_input")); return;
  }
  runJob("hero_create",
    { name: $("h-name").value.trim(), description, age_hint: $("h-age").value.trim(),
      photos: pendingPhotos, variants: 3, ...drawParams() },
    t("job_hero_draw"),
    (job) => {
      if (job.result.hero_id) {
        S.heroId = job.result.hero_id; store.set("heroId", S.heroId);
        S.styleId = null; store.set("styleId", null);
        pendingPhotos = [];  // saved with the hero now; the staging is done
      }
      renderHero();
    });
}

function moreVariants() {
  runJob("hero_more", { hero_id: S.heroId, variants: 2, ...drawParams() },
    t("job_hero_more"), renderHero);
}
function chooseHero(id) {
  if (id !== S.heroId) {  // re-clicking the chosen hero must not reset the style
    S.heroId = id; store.set("heroId", id);
    S.styleId = null; store.set("styleId", null);
  }
  renderHero();
}

  await api(`/api/book/heroes/${S.heroId}`,
    { method: "PUT", body: JSON.stringify({ sheet: path }) });
  renderHero();
}

  `).join("");

  $("style-wish-go").onclick = () => {
    const wish = $("style-wish").value.trim();
    if (!wish) return;
    runJob("style_try", { hero_id: S.heroId, wish, previews: 2, ...drawParams() },
      t("job_style_try"), afterStyle);
  };

  const drop = $("style-drop"), file = $("style-file");
  drop.onclick = () => file.click();
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = async (e) => { e.preventDefault(); drop.classList.remove("over");
    await styleFromImage([...e.dataTransfer.files][0]); };
  file.onchange = () => styleFromImage(file.files[0]);
}

async function styleFromImage(file) {
  if (!file || !file.type.startsWith("image/")) return;
  const reference = await readFile(file);
  runJob("style_try", { hero_id: S.heroId, reference, previews: 2, ...drawParams() },
    t("job_style_from_image"), afterStyle);
}

function tryPreset(key) {
  runJob("style_try", { hero_id: S.heroId, preset: key, previews: 2, ...drawParams() },
    t("job_style_try"), afterStyle);
}
function afterStyle(job) {
  if (job.result.style_id) { S.styleId = job.result.style_id; store.set("styleId", S.styleId); }
  renderLook();
}
function pickStyle(id) { S.styleId = id; store.set("styleId", id); renderLook(); }

async function styleDetail(id) {
  const { styles } = await api("/api/book/styles");
  const s = styles.find((x) => x.id === id);
  if (!s) return;
  const sheet = (s.sheet_urls || {})[S.heroId];
  const blocks = [
    ...s.preview_urls.map((u, i) => [u, ti("look_preview_n", { n: i + 1 })]),
    ...(sheet ? [[sheet, t("look_sheet_in_style")]] : []),
    ...(s.reference_url ? [[s.reference_url, t("look_reference")]] : []),
  ];
  openModal(`<h3>${esc(s.name)}</h3>
    <p class="small muted" style="margin-bottom:1rem">${esc(s.description)}</p>
    ${blocks.length ? `<div class="grid g3" style="margin-bottom:1rem">` + blocks.map(([u, label]) => `
      <div><img src="${esc(tn(u))}" loading="lazy" decoding="async" alt="" onclick="zoom('${esc(u)}')">
        <span class="vlabel">${esc(label)}</span></div>`).join("") + `</div>` : ""}
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" style="color:var(--bad)"
        onclick="closeModal();deleteStyle('${s.id}')">${t("delete")}</button>
      <button class="btn ghost" onclick="closeModal()">${t("close")}</button>
      ${sheet ? `<button class="btn" onclick="closeModal();pickStyle('${s.id}')">${t("look_choose_style")}</button>`
              : `<button class="btn" onclick="closeModal();adoptStyle('${s.id}')">
                  ${t("look_setup_this_figure")} · ${eur(sheetUsd())}</button>`}
    </div>`);
}

function adoptStyle(id) {
  runJob("style_adopt", { hero_id: S.heroId, style_id: id, ...drawParams() },
    t("job_style_adopt"), afterStyle);
}

function deleteStyle(id) {
  confirmModal(t("look_delete_q"), t("look_delete_detail"),
    t("delete"), async () => {
      await api(`/api/book/styles/${id}`, { method: "DELETE" });
      if (S.styleId === id) { S.styleId = null; store.set("styleId", null); }
      toast(t("look_deleted")); renderLook();
    });
}

function runScout() {
  const backends = (S.status.image_backends || []).filter((b) => b.ready).length;
  const usd = 2 * backends * (est().preview_usd || 0.06);
  confirmModal(t("look_scout_q"),
    ti("look_scout_detail",
       { count: backends, images: 2 * backends, price: eur(usd) }),
    t("look_scout_verb"), () =>
      runJob("style_scout", { hero_id: S.heroId, style_id: S.styleId },
        t("job_style_scout"), renderLook));
}

/* =========================================================== 3. story */

async function renderStory() {
  const book = S.bookId ? await api(`/api/book/books/${S.bookId}`).catch(() => null) : null;

  const languageChips = (selected) => (S.status.languages || []).map((l) => `
    <label class="chip ${selected.includes(l.code) ? "on" : ""}">
      <input type="checkbox" value="${l.code}" ${selected.includes(l.code) ? "checked" : ""}
        onchange="this.parentNode.classList.toggle('on',this.checked)">${esc(l.name)}</label>`).join("");

  view().innerHTML = stepsBar("story") + `
    <div class="card">
      <h2>${t("story_what")}</h2>
      <p class="lede">${t("story_lede")}</p>

      <label class="f"><span>${t("story_idea_label")}</span>
        <textarea id="s-idea" rows="3"
          placeholder="Eine Geschichte über Angst im Dunkeln, mit einem Leuchtturm.">${esc(book?.idea || "")}</textarea></label>

      <div class="grid g2">
        <label class="f"><span>${t("story_age_label")}</span>
          <select id="s-age">${(S.status.ages || []).map((a) => `
            <option value="${a.key}" ${(book?.age || "4-5") === a.key ? "selected" : ""}>
              ${esc(a.label)} — ${ti("story_pages_n", { n: a.pages })}</option>`).join("")}</select></label>
        <label class="f"><span>${t("quality")}</span>
          <select id="s-quality">${(S.status.render_profiles || []).map((p) => `
            <option value="${p.key}" ${(book?.render_quality || "draft") === p.key ? "selected" : ""}>
              ${esc(p.label)}</option>`).join("")}</select></label>
      </div>

      <label class="f"><span>${t("story_langs_label")}</span></label>
      <div class="chips" id="s-langs">${languageChips(book?.languages || ["de"])}</div>

      <div class="row" style="margin-top:1rem">
        <label class="check"><input type="checkbox" id="s-rhyme" ${book?.rhyme ? "checked" : ""}>
          ${t("story_rhyme")}</label>
        <label class="check"><input type="checkbox" id="s-revise" checked>
          ${t("story_revise")} <span class="muted small">${t("story_recommended")}</span></label>
      </div>

      <div class="row" style="margin-top:1.3rem">
        <button class="btn" id="s-go" ${can("writing") ? "" : `disabled title="${t("no_writing_key")}"`}>${book ? t("story_write_new") : t("story_write")}</button>
        ${book ? `<button class="btn ghost" onclick="go('book')">${t("story_to_pictures")}</button>` : ""}
      </div>
    </div>
    ${book ? storyEditor(book) : ""}`;

  $("s-go").onclick = () => {
    const languages = [...$("s-langs").querySelectorAll("input:checked")].map((i) => i.value);
    if (!languages.length) return toast(t("pick_a_language"));
    runJob("story_write", {
      hero_id: S.heroId, style_id: S.styleId, idea: $("s-idea").value.trim(),
      age: $("s-age").value, languages, render_quality: $("s-quality").value,
      rhyme: $("s-rhyme").checked, revise: $("s-revise").checked,
    }, t("job_story_write"), (job) => {
      if (job.result.book_id) { S.bookId = job.result.book_id; store.set("bookId", S.bookId); }
      renderStory();
    });
  };
}

function storyEditor(book) {
  const language = (S.editLang && book.languages.includes(S.editLang))
    ? S.editLang : (book.primary_language || book.languages[0]);
  const layoutOptions = (current) => (S.status.layouts || []).map((l) =>
    `<option value="${l.key}" ${l.key === current ? "selected" : ""}>${esc(l.key)}</option>`).join("");

  const languageTabs = book.languages.length > 1 ? `
    <div class="chips" style="margin-top:1rem">${book.languages.map((code) => {
      const name = (S.status.languages.find((l) => l.code === code) || {}).name || code;
      return `<label class="chip ${code === language ? "on" : ""}"
        onclick="setEditLang('${code}')">${esc(name)}</label>`;
    }).join("")}</div>` : "";

  // The rail: one dot per page, coloured by what needs attention, jumping
  // straight to the page. Sixteen pages of forms need a map.
  const rail = book.pages.length > 6 ? `
    <div class="row" style="gap:.25rem;margin-top:1rem" aria-label="${t("story_page_nav")}">
      ${book.pages.map((p) => {
        const colour = p.error ? "var(--bad)"
          : (p.check_status === "failed" || p.image_stale) ? "var(--warn)"
          : p.image_url ? "var(--good)" : "var(--line)";
        return `<a href="#edit-page-${p.index}" title="${ti("page_n", { n: p.index })}"
          style="width:1.5rem;height:1.5rem;border-radius:6px;display:grid;place-items:center;
          font-size:.7rem;text-decoration:none;color:var(--fg);
          border:2px solid ${colour}">${p.index}</a>`;
      }).join("")}</div>` : "";

  return `<div class="card">
    <div class="spread"><div>
      <h2>${esc(book.title[language] || book.display_title)}</h2>
      <p class="lede" style="margin-bottom:0">${
        ti("story_editor_lede", { count: book.pages.length })}</p></div>
      <button class="btn" onclick="go('book')">${t("book_draw_pictures")}</button></div>

    ${book.cast.length ? `<p class="small muted" style="margin-top:.8rem">
      ${ti("story_cast_note", { names: book.cast.map((c) => esc(c.name)).join(", ") })}</p>` : ""}
    ${languageTabs}
    ${rail}

    <div style="margin-top:1.2rem">` + book.pages.map((p) => `
      <div id="edit-page-${p.index}"
        style="display:flex;gap:.9rem;padding:.7rem 0;border-bottom:1px solid var(--line)">
        ${p.image_url
          ? `<img src="${esc(tn(p.image_url))}" loading="lazy" decoding="async" alt="${ti("page_image_alt", { n: p.index })}" onclick="zoom('${esc(p.image_url)}')"
              style="width:76px;height:76px;object-fit:cover;border-radius:8px;cursor:zoom-in;flex:none">`
          : `<div class="num" style="min-width:1.8rem;padding-top:.5rem">${p.index}</div>`}
        <div style="flex:1">
          ${p.image_url ? `<div class="num">${ti("page_n_caps", { n: p.index })}
            ${p.image_stale ? `<span class="flag warn"
              title="${t("story_stale_title")}">${t("story_stale_flag")}</span>` : ""}</div>` : ""}
          <textarea rows="2" data-page="${p.index}" data-lang="${language}" lang="${language}"
            aria-label="${ti("story_text_aria", { n: p.index })}" onchange="savePage(this)">${esc(p.text[language] || "")}</textarea>
          <label class="small muted" style="display:flex;gap:.4rem;align-items:baseline;margin-top:.3rem">
            ${t("story_illustration_short")}
            <input type="text" value="${esc(p.illustration)}" title="${t("story_illustration_title")}"
              style="flex:1;font-size:.82rem;padding:.25rem .5rem"
              onchange="saveIllustration(${p.index}, this.value)">
          </label>
        </div>
        <div style="display:flex;flex-direction:column;gap:.3rem;align-items:flex-end">
          <label class="small muted" style="text-align:right">${t("layout_label")}
            <select style="width:auto;font-size:.78rem;padding:.2rem .4rem;display:block"
              aria-label="${ti("layout_aria", { n: p.index })}"
              onchange="saveLayout(${p.index}, this.value)">${layoutOptions(p.layout)}</select></label>
          <button class="btn ghost tiny" onclick="rewrite(${p.index})"
            title="${t("story_ai_rewrite_title")}">${t("story_ai_rewrite")}</button>
        </div>
      </div>`).join("") + `</div></div>`;
}

function setEditLang(code) { S.editLang = code; renderStory(); }

async function savePage(element) {
  try {
    await api(`/api/book/books/${S.bookId}`, { method: "PUT", body: JSON.stringify({
      pages: [{ index: Number(element.dataset.page),
                text: { [element.dataset.lang]: element.value } }] }) });
    toast(ti("page_saved", { n: element.dataset.page }));
  } catch (exc) {
    toast(ti("save_failed", { message: exc.message }));
  }
}
async function saveLayout(index, layout) {
  try {
    await api(`/api/book/books/${S.bookId}`,
      { method: "PUT", body: JSON.stringify({ pages: [{ index, layout }] }) });
    toast(ti("layout_saved", { n: index }));
  } catch (exc) {
    toast(ti("save_failed", { message: exc.message }));
  }
}
async function saveIllustration(index, illustration) {
  if (!illustration.trim()) return;
  await api(`/api/book/books/${S.bookId}`,
    { method: "PUT", body: JSON.stringify({ pages: [{ index, illustration }] }) });
  toast(ti("illustration_saved", { n: index }));
}
function rewrite(index) {
  openModal(`<h3>${ti("rewrite_title", { n: index })}</h3>
    <label class="f"><span>${t("rewrite_label")}</span>
      <textarea id="m-note" rows="3" placeholder="${esc(t("rewrite_placeholder"))}"></textarea></label>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">${t("cancel")}</button>
      <button class="btn" id="m-go">${t("rewrite_verb")}</button></div>`);
  $("m-go").onclick = () => {
    const note = $("m-note").value.trim();
    closeModal();
    runJob("story_rewrite", { book_id: S.bookId, index, note },
      ti("job_page_rewrite", { n: index }),
      () => (S.screen === "book" ? renderBook() : renderStory()));
  };
}

/* =========================================================== 4. book */

let currentBook = null;

async function renderBook() {
  const book = await api(`/api/book/books/${S.bookId}`);
  currentBook = book;
  // go() set the title before this fetch resolved; now the name is known.
  document.title = pageTitle("book");
  const language = book.primary_language || book.languages[0];
  const drawn = book.pages.filter((p) => p.image).length;
  const spend = book.spend || {};
  const missing = missingEst(book);
  const perImage = perImageUsd(book.render_quality);
  const redrawAllUsd = (book.pages.length + 1) * perImage;

  const qualityPicker = `<select id="b-quality" style="width:auto" title="${t("quality")}"
    onchange="setQuality(this.value)">${(S.status.render_profiles || []).map((p) => `
      <option value="${p.key}" ${book.render_quality === p.key ? "selected" : ""}>
        ${esc(p.label)} — ${ti("book_per_image", { price: eur(perImageUsd(p.key)) })}</option>`).join("")}</select>`;


  view().innerHTML = stepsBar("book") + `
    <div class="card">
      <div class="spread"><div>
        <h2>${esc(book.title[language] || book.display_title)}
          <button class="btn ghost tiny" style="vertical-align:middle"
            onclick="editBookMeta()">${t("edit")}</button></h2>
        <p class="lede" style="margin-bottom:0">${
          ti("book_drawn_of", { drawn, total: book.pages.length })}
          ${book.flagged.length ? `· <span style="color:var(--warn)">${
            ti("book_to_review", { n: book.flagged.length })}</span>` : ""}
          ${spend.calls ? ` · <button class="meter" style="cursor:pointer"
            title="${t("book_cost_title")}" onclick="costDialog()">${
            ti("book_spend_so_far", { amount: spend.eur.toFixed(2) })}</button>` : ""}
          ${book.export_stale && (book.exports || []).length ? ` · <span class="flag warn"
            title="${t("book_export_stale_title")}">${t("book_export_stale")}</span>` : ""}</p>
        <p class="small" style="margin:.5rem 0 0">${nextStep(book, missing)}</p>
      </div>
      <div class="row">
        ${drawn ? `<button class="btn ghost" onclick="openReader()">${t("book_read_aloud")}</button>` : ""}
        <button class="btn ghost" onclick="go('story')">${t("book_edit_text")}</button>
        ${pickerHtml()}${qualityPicker}
        ${missing.images
          ? `<button class="btn" onclick="illustrateAll()">
              ${drawn ? t("book_draw_missing") : t("book_draw_pictures")}
              (${missing.images}) · ${ti("book_from_price", { price: eur(missing.usd) })}</button>`
          : `<button class="btn" onclick="redrawAll()">${t("book_redraw_all")}
              · ${eur(redrawAllUsd)}</button>`}
      </div></div>

      <div id="review">${referencesBanner(book)}${reviewBanners(book, perImage)}</div>

      ${book.cast.length ? `<details style="margin-top:1rem">
        <summary class="small muted">${ti("book_cast_summary", { n: book.cast.length })}</summary>
        <div class="grid g4" style="margin-top:.7rem">` + book.cast.map((c, i) => `
          <div class="pick" style="cursor:default">
            ${c.sheet_url ? `<img src="${esc(tn(c.sheet_url))}" loading="lazy" decoding="async" alt="${esc(ti("book_cast_sheet_alt", { name: c.name }))}"
                onclick="zoom('${esc(c.sheet_url)}')" style="cursor:zoom-in">`
                          : `<div style="aspect-ratio:3/2;background:var(--sunk)"></div>`}
            <div class="cap"><b>${esc(c.name)}</b><small>${c.kind === "place" ? t("book_kind_place") : t("book_kind_character")}
              ${c.sheet_url ? "" : ` · ${t("book_no_sheet")}`}</small>
              <div class="acts" style="margin-top:.4rem">
                <button class="btn ghost tiny" onclick="editCast(${i})">${t("edit")}</button>
                <button class="btn ghost tiny" onclick="redrawCast(${i})"
                  title="${t("book_new_sheet_title")} · ${eur(perImageUsd('draft'))}">${t("book_sheet_redraw")}</button>
              </div></div></div>`).join("") + `</div></details>` : ""}
    </div>

    ${drawn === 0 && book.pages.length ? storyboardCard(book, language, missing) : ""}
    ${printPanel(book)}

    <div class="card" id="seiten">
      <h2>${t("book_pages_heading")}</h2>
      <div class="grid g3" style="margin-top:1rem">
        ${book.cover_url ? `<div class="page">
          <img src="${esc(tn(book.cover_url))}" loading="lazy" decoding="async" onclick="zoom('${esc(book.cover_url)}')" alt="${t("book_cover_alt")}">
          <div class="body"><div class="num">${t("book_cover_caps")}</div>
            <div class="acts">
              <button class="btn ghost tiny" onclick="redrawCover()"
                title="${t("book_cover_only_title")}">${t("redraw")} · ${eur(perImage)}</button>
              <button class="btn ghost tiny" onclick="editBookMeta()">${t("book_cover_change")}</button>
            </div></div></div>` : ""}
        ` + book.pages.map((p) => pageCard(p, language)).join("") + `
      </div>
    </div>

    ${drawn ? `<div id="export">${exportPanel(book)}</div>` : ""}

    <details class="card" id="tools" ${drawn && (book.pages.some((p) => (p.audio_stale || []).length)) ? "open" : ""}>
      <summary style="cursor:pointer"><b>${t("book_more_tools")}</b>
        <span class="muted small">${t("book_more_tools_hint")}</span></summary>
      <div style="margin-top:1rem">

/* The storyboard: the last look before money is spent. Everything the
   illustrator will be told, page by page, plus the total -- and the way back
   to the editor if something reads wrong. */
function storyboardCard(book, language, missing) {
  const rows = book.pages.map((p) => `
    <tr style="border-bottom:1px solid var(--line);vertical-align:top">
      <td class="num" style="padding:.4rem .5rem .4rem 0">${p.index}</td>
      <td style="padding:.4rem .8rem .4rem 0">${esc((p.text[language] || "—").slice(0, 90))}</td>
      <td class="small muted" style="padding:.4rem .8rem .4rem 0">${esc(p.illustration.slice(0, 90))}</td>
      <td class="small muted" style="white-space:nowrap">${esc(p.layout)}${
        p.cast.length ? ` · ${p.cast.map(esc).join(", ")}` : ""}</td>
    </tr>`).join("");
  return `<div class="card">
    <h2>${t("sb_title")}</h2>
    <p class="lede">${ti("sb_lede",
      { images: missing.images, price: eur(missing.usd) })}</p>
    <div style="overflow-x:auto"><table class="small" style="width:100%;border-collapse:collapse">
      <tr class="muted"><th style="text-align:left;padding-right:.5rem">${t("sb_col_no")}</th>
        <th style="text-align:left">${t("sb_col_text")}</th><th style="text-align:left">${t("sb_col_brief")}</th>
        <th style="text-align:left">${t("sb_col_layout")}</th></tr>
      ${rows}</table></div>
    <div class="row" style="margin-top:1rem">
      <button class="btn ghost" onclick="go('story')">${t("sb_change")}</button>
      <button class="btn" onclick="illustrateAll()">${t("sb_go")} (${missing.images} · ${eur(missing.usd)})</button>
    </div></div>`;
}

/* The proof sheet: every page in order, compact, with exactly the numbers a
   print decision needs -- faster than scrolling a wall of cards. */
function proofDialog() {
  const book = currentBook;
  const preset = selectedPreset();
  const language = book.primary_language || book.languages[0];
  const isPrint = !!preset.bleed;
  const cells = book.pages.map((p) => {
    const d = dpiFor(p.image_px, preset);
    const marks = [
      p.error ? t("mark_error") : "",
      p.check_status === "failed" ? t("mark_check") : "",
      (p.check_status === "unknown" || p.check_status === "unchecked") ? t("mark_unchecked") : "",
      p.image_stale ? t("mark_image_stale") : "",
      isPrint && d && d < DPI_FLOOR ? `${d} dpi` : "",
    ].filter(Boolean);
    return `<div style="border:1px solid ${marks.length ? "var(--warn)" : "var(--line)"};
        border-radius:8px;overflow:hidden">
      ${p.image_url ? `<img src="${esc(tn(p.image_url))}" loading="lazy" decoding="async" alt="${ti("page_n", { n: p.index })}"
        style="aspect-ratio:1;object-fit:cover">`
        : `<div style="aspect-ratio:1;background:var(--sunk);display:grid;place-items:center"
            class="small muted">${t("proof_missing")}</div>`}
      <div class="small" style="padding:.3rem .45rem">
        <b>${p.index}</b> ${esc((p.text[language] || "").slice(0, 40))}
        ${marks.length ? `<div style="color:var(--warn)">${marks.map(esc).join(" · ")}</div>` : ""}
      </div></div>`;
  }).join("");
  openModal(`<h3>${esc(ti("proof_title", { name: preset.name || preset.key }))}</h3>
    <div class="grid g4" style="margin-bottom:1rem">${cells}</div>
    <p class="small muted">${t("proof_note")}</p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">${t("close")}</button></div>`);
}

// One plain sentence saying what to do next -- the antidote to a screen with
// nine buttons on it.
function nextStep(book, missing) {
  const review = book.review || { failed: [], unknown: [], errors: [] };
  if (missing.images) {
    return ti(missing.images === 1 ? "next_draw_one" : "next_draw_many",
              { n: missing.images });
  }
  if (review.failed.length + review.errors.length) {
    return t("next_review");
  }
  if (review.unknown.length) {
    return t("next_recheck");
  }
  if (book.export_stale && (book.exports || []).length) {
    return t("next_export_stale");
  }
  if (!(book.exports || []).length) {
    return t("next_all_drawn");
  }
  return t("next_done");
}

/* A book is frozen to the references it was made with. When the hero or the
   style has moved on since, that is worth a calm note -- and an explicit
   button, never an automatic switch. */
function referencesBanner(book) {
  const refs = book.references || {};
  const reasons = [];
  if (refs.hero_changed) reasons.push(t("ref_hero_changed"));
  if (refs.style_changed) reasons.push(t("ref_style_changed"));
  if (refs.style_missing) reasons.push(t("ref_style_missing"));
  if (!reasons.length) return "";
  const canAdopt = refs.hero_changed || refs.style_changed;
  return `<div class="banner" style="margin-top:1.1rem">
    ${ti("ref_frozen", { reasons: reasons.join(", ") })}
    ${canAdopt ? `<div style="margin-top:.6rem"><button class="btn ghost tiny"
      onclick="adoptReferences()">${t("ref_adopt")}</button>
      <span class="small muted">${t("ref_adopt_hint")}</span></div>` : ""}
  </div>`;
}

/* The header figure, opened up: what exactly was paid for. Every image and
   audio call leaves a ledger entry server-side; text calls (story, checks)
   cost cents at most and are billed against free contingents, so they are
   noted rather than counted. */
function costDialog() {
  const spend = currentBook?.spend || {};
  const nice = { pages: t("cost_pages"), cover: t("cost_cover"), narration: t("cost_narration"),
                 scout: t("cost_scout"), cast: t("cost_cast") };
  const rows = Object.entries(spend.by || {}).map(([what, b]) => `
    <tr><td>${esc(nice[what] || what)}</td>
      <td style="text-align:right">${b.calls}×</td>
      <td style="text-align:right">${eur(b.usd)}</td></tr>`).join("");
  const recent = (spend.entries || []).slice(-12).reverse().map((e) => `
    <tr><td class="muted">${esc(nice[e.what] || e.what)}</td>
      <td class="muted">${esc(e.model || "")}</td>
      <td style="text-align:right">${eur(e.usd)}</td></tr>`).join("");
  openModal(`<h3>${ti("cost_title", { amount: (spend.eur ?? 0).toFixed(2) })}</h3>
    <table class="small" style="width:100%;border-collapse:collapse;margin-bottom:1rem">
      ${rows || `<tr><td class="muted">${t("cost_nothing")}</td></tr>`}
    </table>

}

// Failed and unknown checks are different problems with different fixes:
// failed pages get redrawn (costs images), unknown pages get re-checked
// (costs a vision call). One banner each, so the action matches the problem.
function reviewBanners(book, perImage) {
  const review = book.review || { failed: book.flagged || [], unknown: [], errors: [] };
  const trouble = [...review.failed, ...review.errors];
  const pageLinks = (list) => list.map((i) => `<a href="#page-${i}">${i}</a>`).join(", ");
  let html = "";
  if (trouble.length) {
    html += `<div class="banner" style="margin-top:1.1rem" role="alert">
      ${ti(trouble.length === 1 ? "review_trouble_one" : "review_trouble_many",
           { count: trouble.length, pages: pageLinks(trouble) })}
      <div style="margin-top:.6rem"><button class="btn ghost tiny"
        onclick="illustrate(true, [${trouble.join(",")}])">
        ${ti("review_redraw_all", { count: trouble.length })} · ${eur(trouble.length * perImage)}</button></div>
    </div>`;
  }
  if (review.unknown.length) {
    html += `<div class="banner" style="margin-top:${trouble.length ? ".6rem" : "1.1rem"}">
      ${ti(review.unknown.length === 1 ? "review_unknown_one" : "review_unknown_many",
           { count: review.unknown.length, pages: pageLinks(review.unknown) })}
      <div style="margin-top:.6rem"><button class="btn ghost tiny"
        onclick="recheck([${review.unknown.join(",")}])">
        ${t("review_recheck")}</button></div>
    </div>`;
  }
  return html;
}

/* The confirm for the two expensive runs, with an optional spending ceiling:
   the job stops queueing new pages once the ceiling is crossed. */
function bigRunModal(title, detail, verb, params, jobTitle) {
  // Gemini can run the whole batch at half price, if you can wait for it.
  const gemini = currentBackend() === "gemini";
  const count = (currentBook?.pages.length || 0) + 1;
  const profile = params.render_quality || currentBook?.render_quality || "draft";
  const batchUsd = count * perImageUsd(profile) * 0.5;
  openModal(`<h3>${esc(title)}</h3>
    <p class="lede">${esc(detail)} ${t("bigrun_retry_note")}</p>
    ${gemini ? `<label class="check" style="margin-bottom:1rem">
      <input type="checkbox" id="m-batch">
      <span>${ti("bigrun_batch", { price: eur(batchUsd) })}</span></label>` : ""}
    <label class="f" style="max-width:260px"><span>${t("bigrun_cap_label")}</span>
      <input type="number" id="m-budget" min="0" step="0.5" placeholder="${esc(t("bigrun_cap_placeholder"))}"></label>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">${t("cancel")}</button>
      <button class="btn" id="m-go">${esc(verb)}</button></div>`);
  $("m-go").onclick = () => {
    const eurCap = parseFloat($("m-budget").value);
    const batch = !!$("m-batch")?.checked;
    closeModal();
    const budget = Number.isFinite(eurCap) && eurCap > 0
      ? { budget_usd: eurCap * (est().usd_per_eur || 1.08) } : {};
    runJob("book_illustrate",
      { book_id: S.bookId, ...params, ...budget, ...(batch ? { batch: true } : {}),
        ...drawParams() },
      batch ? ti("job_batch_suffix", { title: jobTitle }) : jobTitle, renderBook);
  };
}

function redrawAll() {

// The print-readiness check: are the drawn pictures big enough for 300 dpi?
function printPanel(book) {
  const drawnPages = book.pages.filter((p) => p.image_px);
  if (!drawnPages.length) return "";
  const preset = selectedPreset();
  const worst = Math.min(...drawnPages.map((p) => dpiFor(p.image_px, preset)));
  const weak = drawnPages.filter((p) => dpiFor(p.image_px, preset) < DPI_FLOOR).length;
  if (!weak) {
    return `<div class="card"><h2>${t("print_ready")}</h2>
      <p class="lede" style="margin-bottom:0">${ti("print_ready_note", { dpi: worst })}</p></div>`;
  }
  const usd = (book.pages.length + 1) * perImageUsd("print");
  return `<div class="card"><h2>${t("print_not_ready")}</h2>
    <p class="lede">${ti("print_not_ready_note",
      { weak, total: drawnPages.length, dpi: worst })}</p>
    <button class="btn ghost" onclick="rerenderPrint()">
      ${t("print_redraw")} · ${eur(usd)}</button></div>`;
}

function rerenderPrint() {
  const book = currentBook;
  const usd = (book.pages.length + 1) * perImageUsd("print");
  bigRunModal(t("print_redraw_q"),
    ti("print_redraw_detail", { count: book.pages.length, price: eur(usd) }),

}

function wirePhotoPage() {
  const drop = $("p-drop"), file = $("p-file");
  if (!drop) return;
  drop.onclick = () => file.click();
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = async (e) => { e.preventDefault(); drop.classList.remove("over");
    await uploadPhotoPage([...e.dataTransfer.files][0]); };
  file.onchange = () => uploadPhotoPage(file.files[0]);
}

async function uploadPhotoPage(file) {
  if (!file || !file.type.startsWith("image/")) return;
  const photo = await readFile(file);
  runJob("book_photo", { book_id: S.bookId, photo }, t("job_photo_save"), renderBook);
}
function savePhotoCaption(language) {
  runJob("book_photo", { book_id: S.bookId, caption: { [language]: $("p-caption").value } },
    t("job_caption_save"), renderBook);
}
function removePhoto() {
  runJob("book_photo", { book_id: S.bookId, remove: true }, t("job_photo_remove"), renderBook);
}

/* The print-shop instructions, rendered readable instead of served as a raw
   .md download. The file itself stays on disk for anyone who wants it. */
async function showHandoff(url) {
  let text;

  catch { return toast(t("handoff_missing")); }

      <button class="btn" onclick="closeModal()">${t("close")}</button></div>`);
