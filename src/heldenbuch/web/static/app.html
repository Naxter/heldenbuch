<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heldenbuch — Bilderbücher selber machen</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#fbf7f0; --panel:#fffdf9; --sunk:#f3ede2; --fg:#241f19; --muted:#7d7466;
  --line:#e6ddcd; --accent:#c25e2a; --accent-soft:#f6e3d6; --accent-fg:#fff;
  --good:#2c7a52; --bad:#b03a2e; --warn:#9a6b12;
  --shadow:0 1px 2px rgba(60,45,25,.06),0 8px 24px rgba(60,45,25,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16130e; --panel:#201c15; --sunk:#191610; --fg:#efe8dc; --muted:#a2988a;
    --line:#342e23; --accent:#e08c4a; --accent-soft:#33261a; --accent-fg:#1b1610;
    --good:#63d094; --bad:#ef8b7f; --warn:#e3ba63;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  }
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.6 "Segoe UI",-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
a{color:var(--accent);}
h1,h2,h3{line-height:1.25;margin:0;}
button{font:inherit;}

header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.head{max-width:1180px;margin:0 auto;padding:.85rem 1.25rem;display:flex;align-items:center;gap:1rem;}
.brand{display:flex;align-items:baseline;gap:.55rem;cursor:pointer;}
.brand b{font-size:1.15rem;letter-spacing:-.02em;}
.brand span{font-size:.8rem;color:var(--muted);}
.head .right{margin-left:auto;display:flex;align-items:center;gap:.9rem;font-size:.82rem;}
.head .right a{color:var(--muted);text-decoration:none;}
.head .right a:hover{color:var(--fg);}
main{max-width:1180px;margin:0 auto;padding:1.75rem 1.25rem 8rem;}

.steps{display:flex;gap:.4rem;margin-bottom:1.75rem;flex-wrap:wrap;}
.step{display:flex;align-items:center;gap:.5rem;padding:.4rem .8rem .4rem .45rem;border-radius:99px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:.85rem;
  cursor:pointer;transition:.15s;}
.step .n{width:1.45rem;height:1.45rem;border-radius:50%;background:var(--sunk);color:var(--muted);
  display:grid;place-items:center;font-size:.75rem;font-weight:700;}
.step.on{border-color:var(--accent);color:var(--fg);}
.step.on .n{background:var(--accent);color:var(--accent-fg);}
.step.done .n{background:var(--good);color:#fff;}
.step[disabled]{opacity:.45;cursor:not-allowed;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.4rem;
  box-shadow:var(--shadow);}
.card + .card{margin-top:1.1rem;}
.card h2{font-size:1.15rem;margin-bottom:.3rem;}
.lede{color:var(--muted);font-size:.92rem;margin:0 0 1.2rem;max-width:62ch;}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;}
.spread{display:flex;gap:1rem;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;}
.grid{display:grid;gap:1rem;}
.g2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));}
.g3{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));}
.g4{grid-template-columns:repeat(auto-fill,minmax(165px,1fr));}
.muted{color:var(--muted);} .small{font-size:.85rem;} .hide{display:none !important;}

label.f{display:block;margin-bottom:1rem;}
label.f > span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:.3rem;}
input[type=text],input[type=number],select,textarea{
  width:100%;padding:.6rem .7rem;font:inherit;font-size:.95rem;color:var(--fg);
  background:var(--bg);border:1px solid var(--line);border-radius:9px;}
textarea{resize:vertical;line-height:1.55;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;
  border-color:transparent;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.check{display:inline-flex;align-items:center;gap:.5rem;font-size:.9rem;cursor:pointer;}
.check input{width:auto;accent-color:var(--accent);}
.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.6rem 1.05rem;border-radius:10px;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);
  font-weight:600;font-size:.93rem;cursor:pointer;transition:.12s;}
.btn:hover{filter:brightness(1.06);}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line);font-weight:500;}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn.tiny{padding:.3rem .6rem;font-size:.8rem;border-radius:7px;}

.chips{display:flex;flex-wrap:wrap;gap:.45rem;}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .75rem;border-radius:99px;
  border:1px solid var(--line);background:var(--panel);font-size:.88rem;cursor:pointer;user-select:none;}
.chip input{display:none;}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600;}

.pick{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden;
  cursor:pointer;transition:.15s;text-align:left;padding:0;color:inherit;width:100%;
  position:relative;}
.xdel{position:absolute;top:.45rem;right:.45rem;z-index:2;width:1.6rem;height:1.6rem;
  border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  cursor:pointer;font-size:.9rem;line-height:1;opacity:0;transition:.15s;}
.pick:hover .xdel{opacity:1;}
.xdel:hover{color:var(--bad);border-color:var(--bad);}
.pick:hover{border-color:var(--accent);transform:translateY(-1px);}
.pick.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.pick img{width:100%;aspect-ratio:3/2;object-fit:contain;background:var(--sunk);display:block;}
.pick.tall img{aspect-ratio:1;object-fit:cover;}
.pick .cap{padding:.6rem .75rem;}
.pick .cap b{display:block;font-size:.92rem;}
.pick .cap small{color:var(--muted);font-size:.79rem;}

.drop{border:2px dashed var(--line);border-radius:12px;padding:1.6rem;text-align:center;
  background:var(--sunk);cursor:pointer;transition:.15s;}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);}
.thumbs{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem;}
.thumbs img{width:74px;height:74px;object-fit:cover;border-radius:9px;border:1px solid var(--line);}

.page{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;}
.page img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--sunk);cursor:zoom-in;}
.page .body{padding:.7rem .8rem;}
.page .num{font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.04em;}
.page .acts{display:flex;gap:.35rem;margin-top:.45rem;flex-wrap:wrap;}
.flag{display:inline-block;padding:.12rem .45rem;border-radius:6px;font-size:.72rem;font-weight:700;}
.flag.warn{background:var(--accent-soft);color:var(--warn);}
.flag.bad{background:var(--accent-soft);color:var(--bad);}
.flag.calm{background:var(--sunk);color:var(--muted);}
.notes{margin:.4rem 0 0;padding-left:1rem;font-size:.78rem;color:var(--warn);}

#drawer{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);
  border-top:1px solid var(--line);box-shadow:0 -8px 32px rgba(60,45,25,.10);
  transform:translateY(100%);transition:transform .22s ease;}
#drawer.open{transform:none;}
.dhead{display:flex;align-items:center;gap:.8rem;padding:.7rem 1.25rem;max-width:1180px;margin:0 auto;}
.dhead .title{font-weight:600;font-size:.93rem;}
.dhead .right{margin-left:auto;display:flex;gap:.5rem;align-items:center;}
#dlog{max-width:1180px;margin:0 auto;padding:0 1.25rem 1rem;height:0;overflow:auto;
  font-family:ui-monospace,Consolas,monospace;font-size:.79rem;line-height:1.55;
  white-space:pre-wrap;color:var(--muted);transition:height .22s ease;}
#drawer.tall #dlog{height:min(42vh,360px);}
.spinner{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;flex:none;}
#dprog{flex:1;max-width:240px;height:5px;border-radius:3px;background:var(--sunk);
  overflow:hidden;position:relative;}
#dprog>div{height:100%;background:var(--accent);border-radius:3px;transition:width .5s;}
#dprog.indeterminate>div{width:32% !important;position:absolute;
  animation:slide 1.4s ease-in-out infinite;}
@keyframes slide{0%{left:-32%;}100%{left:100%;}}
#dcount{font-size:.8rem;color:var(--muted);white-space:nowrap;}
#derror{max-width:1180px;margin:0 auto;padding:0 1.25rem .9rem;}
#derror .inner{border:1px solid var(--bad);border-radius:10px;padding:.7rem .9rem;
  font-size:.88rem;white-space:pre-line;}
@keyframes spin{to{transform:rotate(360deg);}}
.dot{width:9px;height:9px;border-radius:50%;flex:none;}

.empty{text-align:center;padding:3.5rem 1rem;color:var(--muted);}
.empty h2{font-size:1.4rem;color:var(--fg);margin-bottom:.5rem;}
.banner{padding:.8rem 1rem;border-radius:10px;background:var(--accent-soft);color:var(--warn);
  font-size:.88rem;margin-bottom:1.2rem;}
.banner.bad{color:var(--bad);}
dialog{border:none;border-radius:14px;padding:0;background:var(--panel);max-width:94vw;
  box-shadow:var(--shadow);}
dialog img{display:block;max-width:92vw;max-height:88vh;}
dialog::backdrop{background:rgba(30,22,12,.82);}
/* the lightbox: one picture, the whole screen, nothing else */
dialog#viewer{background:transparent;box-shadow:none;max-width:100vw;max-height:100vh;
  width:100vw;height:100vh;margin:0;}
#viewer img{width:100vw;height:100vh;max-width:100vw;max-height:100vh;object-fit:contain;
  cursor:zoom-out;}
#viewer .vbar{position:fixed;top:1rem;right:1rem;display:flex;gap:.5rem;}
#viewer .vbar button{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);
  color:#f6efe2;border-radius:9px;padding:.45rem .8rem;cursor:pointer;font-size:.85rem;}
#viewer .vbar button:hover{background:rgba(0,0,0,.75);}
.xzoom{position:absolute;top:.45rem;left:.45rem;z-index:2;width:1.6rem;height:1.6rem;
  border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  cursor:zoom-in;font-size:.8rem;line-height:1;opacity:0;transition:.15s;}
.pick:hover .xzoom{opacity:1;}
.xzoom:hover{color:var(--accent);border-color:var(--accent);}
.file{display:flex;gap:.8rem;align-items:center;border:1px solid var(--line);
  border-radius:10px;padding:.65rem .85rem;background:var(--bg);}
.file .ficon{font-size:1.5rem;flex:none;}
dialog.modal{padding:1.4rem;width:min(94vw,620px);color:var(--fg);}
dialog.modal h3{font-size:1.1rem;margin-bottom:.8rem;}
dialog.modal img{max-width:100%;max-height:none;width:100%;border-radius:9px;
  border:1px solid var(--line);cursor:zoom-in;}
dialog.modal .vlabel{font-size:.75rem;color:var(--muted);margin-top:.3rem;display:block;}
#toast{position:fixed;bottom:4.6rem;left:50%;transform:translateX(-50%);z-index:70;
  background:var(--fg);color:var(--bg);padding:.55rem 1rem;border-radius:99px;
  font-size:.88rem;box-shadow:var(--shadow);max-width:88vw;}
.bookcard img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--sunk);}
/* the bookshelf: covers first, everything else steps back */
.shelf{display:grid;gap:1.5rem 1.3rem;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));}
.tome{position:relative;cursor:pointer;transition:transform .18s;}
.tome:hover,.tome:focus-visible{transform:translateY(-4px);}
.tome-cover{position:relative;border-radius:10px;overflow:hidden;
  box-shadow:0 8px 22px rgba(60,45,25,.20),0 2px 6px rgba(60,45,25,.14);}
.tome-cover img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--sunk);}
.tome-blank{width:100%;aspect-ratio:1;background:var(--sunk);display:grid;place-items:center;
  color:var(--muted);padding:1rem;text-align:center;font-style:italic;}
.tome-read{position:absolute;inset:0;margin:auto;width:3.4rem;height:3.4rem;border-radius:50%;
  border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.55);color:#fff;
  font-size:1.25rem;cursor:pointer;opacity:0;transition:.15s;}
.tome:hover .tome-read,.tome:focus-within .tome-read{opacity:1;}
.tome-read:hover{background:var(--accent);}
.tome-chip{position:absolute;top:.6rem;left:.6rem;background:rgba(0,0,0,.55);color:#fff;
  padding:.18rem .6rem;border-radius:99px;font-size:.72rem;}
.tome-cap{padding:.65rem .15rem 0;}
.tome-cap b{display:block;font-size:.95rem;line-height:1.3;}
.meter{display:inline-flex;align-items:baseline;gap:.35rem;font-size:.8rem;color:var(--muted);
  border:1px solid var(--line);border-radius:99px;padding:.2rem .65rem;}
.meter b{color:var(--fg);font-size:.88rem;}

/* ---------------------------------------------------------- read aloud */
#reader{position:fixed;inset:0;z-index:60;background:#0d0b07;display:none;
  align-items:center;justify-content:center;flex-direction:column;}
#reader.on{display:flex;}
#reader .sheet{max-width:min(96vw,calc(88vh * 1.0));max-height:88vh;position:relative;}
#reader img{max-width:100%;max-height:78vh;border-radius:10px;display:block;
  box-shadow:0 20px 60px rgba(0,0,0,.6);}
#reader .words{color:#f6efe2;font-size:clamp(1rem,2.2vw,1.5rem);line-height:1.5;
  text-align:center;margin:1rem auto 0;max-width:46ch;text-shadow:0 2px 12px rgba(0,0,0,.7);
  white-space:pre-line;}
#reader .bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:.6rem;align-items:center;
  justify-content:center;padding:1rem;background:linear-gradient(transparent,rgba(0,0,0,.65));}
#reader .bar button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  color:#f6efe2;border-radius:10px;padding:.5rem .9rem;cursor:pointer;font-size:.9rem;}
#reader .bar button:hover{background:rgba(255,255,255,.22);}
#reader .bar button.on{background:var(--accent);border-color:var(--accent);}
#reader .counter{color:#cbbfa9;font-size:.85rem;min-width:5rem;text-align:center;}
#reader .close{position:fixed;top:1rem;right:1rem;}
</style>
</head>
<body>

<header>
  <div class="head">
    <div class="brand" onclick="go('home')">
      <b>Heldenbuch</b><span>Bilderbücher selber machen</span>
    </div>
    <div class="right">
      <a href="#" onclick="go('home');return false">Meine Bücher</a>
      <a href="/benchmark" title="Technischer Vergleich der Bildmodelle">Labor</a>
    </div>
  </div>
</header>

<main id="view"></main>

<div id="drawer">
  <div class="dhead">
    <div class="spinner hide" id="dspin"></div>
    <div class="dot hide" id="ddot"></div>
    <div class="title" id="dtitle" role="status" aria-live="polite">Bereit</div>
    <div id="dprog" class="hide"><div style="width:0%"></div></div>
    <span id="dcount"></span>
    <div class="right">
      <button class="btn ghost tiny" onclick="jobCenter()"
        title="Alle laufenden und letzten Aufträge">Aufträge</button>
      <button class="btn ghost tiny" id="dtoggle">Details</button>
      <button class="btn ghost tiny" id="dcancel">Abbrechen</button>
      <button class="btn ghost tiny hide" id="dclose">Schließen</button>
    </div>
  </div>
  <div id="derror" class="hide" role="alert"><div class="inner"></div></div>
  <pre id="dlog"></pre>
</div>

<dialog id="viewer" aria-label="Großansicht">
  <img id="viewer-img" alt="Großansicht">
  <div class="vbar">
    <button onclick="event.stopPropagation();toggleViewerFullscreen()"
      title="Echtes Vollbild ohne Browserleiste">⛶ Vollbild</button>
    <button onclick="event.stopPropagation();$('viewer').close()">✕ Schließen (Esc)</button>
  </div>
</dialog>
<dialog id="modal" class="modal"></dialog>
<div id="toast" class="hide" role="status" aria-live="polite"></div>

<div id="reader">
  <button class="btn ghost tiny close" onclick="closeReader()">Schließen</button>
  <div class="sheet">
    <img id="r-img" alt="">
    <div class="words" id="r-text"></div>
  </div>
  <div class="bar">
    <button onclick="turn(-1)" title="Zurückblättern (Pfeil links)">◀</button>
    <button id="r-play" onclick="toggleAudio()">▶ Vorlesen</button>
    <button id="r-auto" onclick="toggleAuto()"
      title="Liest jede Seite vor und blättert von selbst weiter">▶▶ Auto</button>
    <span class="counter" id="r-count"
      title="Blättern: Pfeiltasten oder Leertaste · Schließen: Esc"></span>
    <select id="r-lang" onchange="readerLangChanged()"
      style="width:auto;background:rgba(255,255,255,.12);color:#f6efe2;border-color:rgba(255,255,255,.2)"></select>
    <button onclick="turn(1)" title="Weiterblättern (Pfeil rechts, Leertaste)">▶</button>
  </div>
  <audio id="r-audio" hidden></audio>
</div>

<script>
"use strict";

/* =========================================================== plumbing */

const $ = (id) => document.getElementById(id);
// The apostrophe matters: a handful of interpolations sit inside single-quoted
// JavaScript string literals in onclick attributes, where a bare ' closes the
// string early.
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const view = () => $("view");

async function api(path, options = {}) {
  const response = await fetch(path, {
    headers: { "Content-Type": "application/json" }, ...options,
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
  return payload;
}

const store = {
  get(key, fallback = null) {
    try { return JSON.parse(localStorage.getItem("heldenbuch." + key)) ?? fallback; }
    catch { return fallback; }
  },
  set(key, value) { localStorage.setItem("heldenbuch." + key, JSON.stringify(value)); },
};

const S = {
  status: null, screen: "home",
  heroId: store.get("heroId"), styleId: store.get("styleId"), bookId: store.get("bookId"),
  job: null, seen: 0, poll: null, onDone: null,
  //: jobs still queued/running whose completion callback must not be lost
  //: when a newer job takes over the drawer
  watch: [],
  //: which language the story editor currently edits
  editLang: null,
};

/* --------------------------------------------------- toast + modal + money */

function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.classList.remove("hide");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.add("hide"), 3500);
}

let modalOpener = null;  // where focus goes back to when the dialog closes

function openModal(html) {
  const m = $("modal");
  modalOpener = document.activeElement;
  m.innerHTML = html;
  const heading = m.querySelector("h3");
  if (heading) m.setAttribute("aria-label", heading.textContent);
  m.showModal();
  return m;
}
function closeModal() { $("modal").close(); }
$("modal").addEventListener("close", () => {
  if (modalOpener && document.contains(modalOpener)) modalOpener.focus();
  modalOpener = null;
});

// Cards and drop zones are divs (they carry inner buttons, which a real
// <button> may not). role=button + this handler makes them keyboard-usable.
document.addEventListener("keydown", (event) => {
  if ((event.key === "Enter" || event.key === " ")
      && event.target instanceof Element
      && event.target.getAttribute("role") === "button") {
    event.preventDefault();
    event.target.click();
  }
});

function confirmModal(question, detail, verb, onYes) {
  openModal(`<h3>${esc(question)}</h3>
    <p class="lede">${esc(detail || "")}</p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn" id="m-yes">${esc(verb)}</button></div>`);
  $("m-yes").onclick = () => { closeModal(); onYes(); };
}

// Turns an estimated dollar amount into the "~0,30 €" a button shows.
// false only when the status says this capability is missing
function can(name) { return S.status?.capabilities?.[name] !== false; }

function eur(usd) {
  const rate = S.status?.estimates?.usd_per_eur || 1.08;
  return `~${(usd / rate).toFixed(2).replace(".", ",")} €`;
}
function est() { return S.status?.estimates || {}; }
function profileEst(key) {
  const profile = (S.status?.render_profiles || []).find((p) => p.key === key);
  return profile?.est_usd ?? 0.06;
}
/* Which image service and model draw this book. The choice is per action:
   pick a model, then redraw one page with it, and only that page uses it. */
function currentBackend() {
  const ready = (S.status?.image_backends || []).filter((b) => b.ready).map((b) => b.name);
  const saved = store.get("imageBackend");
  if (saved && ready.includes(saved)) return saved;
  const scouted = currentBook?.style?.recommended_backend;  // the scout's pick
  if (scouted && ready.includes(scouted)) return scouted;
  return ready.includes("openai") ? "openai" : (ready[0] || "openai");
}
function modelsFor(backend) {
  return (S.status?.image_models || []).filter((m) => m.backend === backend);
}
function currentModelInfo() {
  const models = modelsFor(currentBackend());
  const saved = store.get("imageModel." + currentBackend());
  return models.find((m) => m.key === saved) || models[0] || null;
}
// per-image price for the chosen service/model at a render profile
function perImageUsd(profileKey) {
  const model = currentModelInfo();
  if (!model) return profileEst(profileKey);
  if (model.pricing === "flat") {
    return profileKey === "print" ? (model.usd_print ?? model.usd) : model.usd;
  }
  return profileEst(profileKey) * (model.factor ?? 1);
}
function drawParams() {
  const model = currentModelInfo();
  return { backend: currentBackend(), ...(model ? { model: model.key } : {}) };
}
// Sheets are drawn at high quality, previews at medium -- price them for the
// chosen service and model.
function sheetUsd() {
  const m = currentModelInfo();
  if (!m) return est().sheet_usd || 0.22;
  return m.pricing === "flat" ? m.usd : (est().sheet_usd || 0.22) * (m.factor ?? 1);
}
function previewUsd() {
  const m = currentModelInfo();
  if (!m) return est().preview_usd || 0.06;
  return m.pricing === "flat" ? m.usd : (est().preview_usd || 0.06) * (m.factor ?? 1);
}
// The service/model choice, as a compact control any drawing screen can show.
function pickerHtml() {
  const ready = (S.status?.image_backends || []).filter((b) => b.ready);
  const models = modelsFor(currentBackend());
  if (ready.length < 2 && models.length < 2) return "";
  return `<span class="row" style="gap:.4rem">
    ${ready.length > 1 ? `<select style="width:auto" title="Welcher Bilddienst zeichnet"
      onchange="setBackend(this.value)">${ready.map((b) => `<option value="${b.name}"
        ${b.name === currentBackend() ? "selected" : ""}>${esc(b.name)}</option>`).join("")}</select>` : ""}
    ${models.length > 1 ? `<select style="width:auto" title="Bildmodell"
      onchange="setModel(this.value)">${models.map((m) => `<option value="${m.key}"
        ${m.key === currentModelInfo()?.key ? "selected" : ""}>${esc(m.label)}</option>`).join("")}</select>` : ""}
  </span>`;
}

// What "draw the missing pictures" would cost for this book right now.
function missingEst(book) {
  const perImage = perImageUsd(book.render_quality);
  const pages = book.pages.filter((p) => !p.image_url).length;
  const cover = book.cover_url ? 0 : 1;
  const cast = (book.cast || []).filter((c) => !c.sheet_url).length;
  return { images: pages + cover + cast,
           usd: (pages + cover) * perImage + cast * perImageUsd("draft") };
}

function readFile(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve({ name: file.name, data: reader.result });
    reader.readAsDataURL(file);
  });
}

function zoom(url) { $("viewer-img").src = url; $("viewer").showModal(); }
$("viewer").onclick = () => $("viewer").close();
$("viewer").addEventListener("close", () => {

});
function toggleViewerFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else $("viewer").requestFullscreen?.();
}
// The language name for a code, everywhere the UI speaks to a person.
function langName(code) {
  return (S.status?.languages?.find((l) => l.code === code) || {}).name || code;

/* =========================================================== jobs */

function drawer(open, tall) {
  $("drawer").classList.toggle("open", open);
  if (tall !== undefined) $("drawer").classList.toggle("tall", tall);
}
$("dtoggle").onclick = () => $("drawer").classList.toggle("tall");
$("dclose").onclick = () => drawer(false, false);
$("dcancel").onclick = async () => {
  if (S.job) await api(`/api/jobs/${S.job}/cancel`, { method: "POST" });
};

async function runJob(action, params, title, onDone) {
  $("dlog").textContent = "";
  $("dtitle").textContent = title;
  $("dspin").classList.remove("hide");
  $("ddot").classList.add("hide");
  $("dcancel").classList.remove("hide");
  $("dclose").classList.add("hide");
  $("dprog").classList.add("hide");
  $("dcount").textContent = "";
  $("derror").classList.add("hide");
  drawer(true, true);
  // The drawer follows the newest job, but an earlier one that is still
  // queued or running must keep its completion callback.
  if (S.job) S.watch.push({ id: S.job, onDone: S.onDone });
  S.seen = 0;
  S.onDone = onDone;

  try {
    const job = await api("/api/jobs", {
      method: "POST", body: JSON.stringify({ action, ...params }),
    });
    S.job = job.id;
    clearInterval(S.poll);
    S.poll = setInterval(pollJob, 900);
    pollJob();
  } catch (exc) {
    $("dlog").textContent = exc.message;
    $("dspin").classList.add("hide");
    $("dclose").classList.remove("hide");
  }
}

async function pollJob() {
  pollWatch();
  if (!S.job) return;
  let job;
  try { job = await api(`/api/jobs/${S.job}?since=${S.seen}`); }
  catch (exc) { appendLog(`Verbindung verloren: ${exc.message}`); return endJob(null); }

  if (job.lines.length) { S.seen = job.total_lines; appendLog(job.lines.join("\n")); }
  const name = JOB_NAMES[job.action] || job.action;
  $("dtitle").textContent = job.status === "queued"
    ? `${name} — wartet (${job.queued_behind} vor dir)`
    : `${name} · ${Math.round(job.elapsed)}s`;

  // The bar: real progress when the worker reports it, a wandering shimmer
  // while a model is thinking and there is nothing to count yet.
  const bar = $("dprog");
  if (job.status === "running") {
    bar.classList.remove("hide");
    if (job.progress && job.progress.total) {
      bar.classList.remove("indeterminate");
      bar.firstElementChild.style.width =
        `${Math.round(100 * job.progress.done / job.progress.total)}%`;
      $("dcount").textContent = `${job.progress.done} / ${job.progress.total}`;
    } else {
      bar.classList.add("indeterminate");
      $("dcount").textContent = "";
    }
  }

  // Finished pages appear on the book screen while the rest are still drawn.
  if (job.status === "running" && S.screen === "book"
      && (job.action === "book_illustrate" || job.action === "book_check")
      && (pollJob.tick = (pollJob.tick || 0) + 1) % 4 === 0) {
    patchDrawnPages();
  }

  if (job.status !== "running" && job.status !== "queued") endJob(job);
}

/* Swap "noch nicht gezeichnet" placeholders for finished pictures in place --
   no full re-render, so nothing jumps while the user watches. */
async function patchDrawnPages() {
  if (!S.bookId) return;
  let book;
  try { book = await api(`/api/book/books/${S.bookId}`); } catch { return; }
  currentBook = book;
  for (const page of book.pages) {
    const card = document.getElementById(`page-${page.index}`);
    if (!card) continue;
    const placeholder = card.querySelector("div.small.muted");
    if (page.image_url && !card.querySelector("img")) {
      const img = document.createElement("img");
      img.src = page.image_url;
      img.alt = `Illustration Seite ${page.index}`;
      img.onclick = () => zoom(page.image_url);
      placeholder?.replaceWith(img);
    } else if (!page.image_url && placeholder) {
      placeholder.textContent = "wird gezeichnet …";
    }
  }
}

async function pollWatch() {
  for (const watched of [...S.watch]) {
    try {
      const job = await api(`/api/jobs/${watched.id}?since=999999`);
      if (job.status === "running" || job.status === "queued") continue;
      S.watch = S.watch.filter((w) => w !== watched);
      if (watched.onDone) watched.onDone(job);
    } catch { S.watch = S.watch.filter((w) => w !== watched); }
  }
}

function appendLog(text) {
  const log = $("dlog");
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  log.textContent += (log.textContent ? "\n" : "") + text;
  if (atBottom) log.scrollTop = log.scrollHeight;
}

function endJob(job) {
  clearInterval(S.poll); S.poll = null; S.job = null;
  // A cancelled queued job can finish before an older running one: keep
  // polling quietly until every watched job has reported back.
  if (S.watch.length) {
    S.poll = setInterval(async () => {
      await pollWatch();
      if (!S.watch.length && !S.job) { clearInterval(S.poll); S.poll = null; }
    }, 1200);
  }
  $("dspin").classList.add("hide");
  $("dcancel").classList.add("hide");
  $("dclose").classList.remove("hide");

  const dot = $("ddot");
  dot.classList.remove("hide");
  const ok = job && job.status === "done";
  dot.style.background = ok ? "var(--good)"
    : (job && job.status === "cancelled" ? "var(--warn)" : "var(--bad)");
  $("dtitle").textContent = ok ? "Fertig"
    : (job ? ({ cancelled: "Abgebrochen", failed: "Fehlgeschlagen" }[job.status] || job.status)
           : "Fehler");
  $("dprog").classList.add("hide");
  $("dcount").textContent = "";
  if (ok) $("drawer").classList.remove("tall");

  // A failure gets its explanation front and centre -- the advice lives in
  // the error text itself now, not in a log line someone has to find.
  if (job && job.status === "failed" && job.error) {
    $("derror").querySelector(".inner").textContent = job.error;
    $("derror").classList.remove("hide");
    $("drawer").classList.add("tall");
  }

  const callback = S.onDone; S.onDone = null;
  if (callback && job) callback(job);
}

/* The job center: every queued, running and recent job in one place, with a
   retry for failures. The drawer follows only the newest job; this is where
   an overlapping second job stays visible and understandable. */
const JOB_NAMES = {
  hero_create: "Figur zeichnen", hero_more: "Weitere Varianten",
  style_try: "Stil ausprobieren", style_adopt: "Stil einrichten",
  style_scout: "Bilddienste vergleichen", voice_preview: "Stimmprobe",
  story_write: "Geschichte schreiben", story_rewrite: "Seite neu schreiben",
  story_languages: "Sprache dazu", book_illustrate: "Bilder zeichnen",
  book_check: "Seiten prüfen", book_undo: "Seite zurück",
  book_photo: "Fotoseite", book_narrate: "Ton erzeugen", book_export: "PDF bauen",
};
const JOB_STATES = {
  queued: ["wartet", "var(--warn)"], running: ["läuft", "var(--accent)"],
  done: ["fertig", "var(--good)"], failed: ["fehlgeschlagen", "var(--bad)"],
  cancelled: ["abgebrochen", "var(--muted)"],
};

async function jobCenter() {
  let status;
  try { status = await api("/api/book/status"); } catch { return; }
  const jobs = status.jobs || [];
  const rows = jobs.map((job) => {
    const [word, colour] = JOB_STATES[job.status] || [job.status, "var(--muted)"];
    const queuePos = job.status === "queued" && job.queued_behind
      ? ` — ${job.queued_behind} davor` : "";
    const canRetry = job.status === "failed";
    const canCancel = job.status === "running" || job.status === "queued";
    return `<tr>
      <td>${esc(JOB_NAMES[job.action] || job.action)}</td>
      <td style="color:${colour};white-space:nowrap">${word}${queuePos}</td>
      <td class="muted" style="text-align:right;white-space:nowrap">${Math.round(job.elapsed)}s</td>
      <td style="text-align:right;white-space:nowrap">
        ${canCancel ? `<button class="btn ghost tiny" onclick="cancelJob('${job.id}')">abbrechen</button>` : ""}
        ${canRetry ? `<button class="btn ghost tiny" onclick="retryJob('${job.id}')">erneut</button>` : ""}
        ${job.status === "failed" && job.error ? `<span class="small muted" title="${esc(job.error)}">warum?</span>` : ""}
      </td></tr>`;
  }).join("");
  openModal(`<h3>Aufträge</h3>
    ${jobs.length ? `<table class="small" style="width:100%;border-collapse:collapse">
      ${rows}</table>` : `<p class="lede">Gerade läuft nichts.</p>`}
    <p class="small muted" style="margin-top:.8rem">Es läuft immer nur ein Auftrag —
      alles weitere wartet in der Reihe und geht dann von selbst los.</p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Schließen</button></div>`);
}

async function cancelJob(id) {
  await api(`/api/jobs/${id}/cancel`, { method: "POST" });
  toast("Wird abgebrochen.");
  closeModal();
}

async function retryJob(id) {
  const job = await api(`/api/jobs/${id}`);
  closeModal();
  runJob(job.action, job.params || {},
    `${JOB_NAMES[job.action] || job.action} — neuer Versuch`, () => render());
}

function stepsBar(current) {

  drawing: ["Bilder zeichnen", "einen Bilddienst-Schlüssel in .env eintragen (OPENAI_API_KEY reicht) — oder lokal ComfyUI starten"],

function capabilityChecklist() {
  const caps = S.status?.capabilities || {};

  return `<div class="banner" role="alert">
    <b>Noch nicht alles ist einsatzbereit</b> — was geht, geht trotzdem:
    <ul class="small" style="margin:.4rem 0 0;padding-left:1.2rem">
      ${working.map(([, [name]]) => `<li>✓ ${esc(name)}</li>`).join("")}

}

async function recheckSetup() {
  try { S.status = await api("/api/book/status"); } catch {}
  toast("Geprüft.");
  render();
}

async function renderHome() {
  const [{ books }, { heroes }] = await Promise.all([
    api("/api/book/books"), api("/api/book/heroes"),
  ]);

  const warn = capabilityChecklist();

  if (!books.length && !heroes.length) {
    view().innerHTML = warn + `
      <div class="empty">
        <h2>Noch kein Buch da.</h2>
        <p class="lede" style="margin:0 auto 1.6rem">
          In vier Schritten: wer ist der Held, wie soll es aussehen, worum geht es —
          und dann drucke ich es dir zusammen.</p>
        <button class="btn" onclick="startNew()">Erstes Buch anfangen</button>
      </div>`;
    return;
  }

  // Making a second book with a hero who already exists skips the two slow,
  // expensive steps entirely.
  const shortcuts = heroes.filter((h) => h.sheet).map((h) => `
    <button class="btn ghost tiny" onclick="newBookWith('${h.id}')">Neues Buch mit ${esc(h.name || "…")}</button>
  `).join("");

  view().innerHTML = warn + `
    <div class="spread" style="margin-bottom:1.6rem;align-items:center">
      <h1 style="font-size:1.6rem">Meine Bücher</h1>
      <button class="btn" onclick="startNew()">Neues Buch</button>
    </div>
    ${books.length ? `<div class="shelf">` + books.map(bookTile).join("") + `</div>`
                   : `<p class="lede">Noch kein fertiges Buch.</p>`}
    <div class="row" style="margin-top:2.4rem;padding-top:1rem;border-top:1px solid var(--line)">
      <span class="small muted">Schnell anfangen:</span>
      ${shortcuts}
      <button class="btn ghost tiny" onclick="restoreDialog()"
        title="Eine Buch-Sicherung (ZIP) aus library/backups zurückholen">Aus Sicherung wiederherstellen</button>
    </div>`;
}

/* One book on the shelf: the cover carries it. Hovering offers reading
   straight away -- the shelf is for the child as much as for the maker. */
function bookTile(b) {
  const langs = b.languages.map(langName).join(", ");
  const unfinished = b.drawn < b.pages;
  return `<div class="tome" role="button" tabindex="0"
      aria-label="„${esc(b.title)}“ öffnen" onclick="openBook('${b.id}')">
    <div class="tome-cover">
      ${b.cover_url ? `<img src="${esc(b.cover_url)}" alt="Titelbild von ${esc(b.title)}">`
                    : `<div class="tome-blank">${esc(b.title)}</div>`}
      ${b.drawn ? `<button class="tome-read" title="Sofort vorlesen"
        aria-label="„${esc(b.title)}“ vorlesen"
        onclick="event.stopPropagation();readBook('${b.id}')">▶</button>` : ""}
      ${unfinished ? `<span class="tome-chip">${b.drawn
        ? `${b.drawn}/${b.pages} gezeichnet` : "in Arbeit — noch ungezeichnet"}</span>` : ""}
    </div>
    <div class="tome-cap"><b>${esc(b.title)}</b>
      <small class="muted">${esc(langs)}</small></div>
  </div>`;
}

async function readBook(id) {
  await openBook(id);
  setTimeout(() => openReader(), 450);
}

function startNew() { S.bookId = null; store.set("bookId", null); go("hero"); }

async function newBookWith(heroId) {
  S.heroId = heroId; store.set("heroId", heroId);
  S.bookId = null; store.set("bookId", null);
  const { styles } = await api(`/api/book/styles?hero=${heroId}`);
  if (styles.length === 1) {
    // One compatible style: take it, but say so out loud.
    S.styleId = styles[0].id; store.set("styleId", S.styleId);
    toast(`Stil „${styles[0].name}“ übernommen — ändern jederzeit unter „Stil“.`);
    go("story");
  } else if (styles.length > 1) {
    // Several: the choice is real, so it has to be made, not guessed.
    S.styleId = null; store.set("styleId", null);
    go("look");
  } else {
    go("look");
  }
}

async function openBook(id) {
  S.bookId = id; store.set("bookId", id);
  const book = await api(`/api/book/books/${id}`);
  S.heroId = book.hero_id; store.set("heroId", book.hero_id);
  S.styleId = book.style_id; store.set("styleId", book.style_id);
  go("book");
}
